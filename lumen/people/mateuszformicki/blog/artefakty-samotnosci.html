o,", "coś się zmienia, wyrastają nowe drzewa. Jeżom pcheł przybywa, a", "modlitwa jest, jak była. Ale okolica jakby inna."], ["To nie miejsce,", "nas tu trzyma, go się nie wspomina, ale każda chwila..."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-wierszepoematy\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-wierszepoematy)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <line x1=\"78\" y1=\"160\" x2=\"362\" y2=\"160\" stroke-width=\"0.9\" opacity=\"0.45\"/>\n            <!-- Drzewo i dom -->\n            <path d=\"M148 160 V112 M148 126 L132 110 M148 120 L166 104\" stroke-width=\"1.2\"/>\n            <circle cx=\"148\" cy=\"96\" r=\"28\" stroke-width=\"1\" fill=\"currentColor\" fill-opacity=\"0.1\"/>\n            <path d=\"M206 160 V118 L236 92 L266 118 V160\" stroke-width=\"1.2\" opacity=\"0.82\"/>\n            <!-- Dzwon pod szczytem dachu -->\n            <path d=\"M232 114 Q236 106 240 114 L242 120 H230 Z\" fill=\"currentColor\" fill-opacity=\"0.3\" stroke-width=\"0.9\"/>\n            <!-- Mały jeż wśród liści po prawej -->\n            <path d=\"M298 160 Q308 144 324 152 L332 157 L324 160 Z\" fill=\"currentColor\" fill-opacity=\"0.2\" stroke-width=\"1\"/>\n            <line x1=\"304\" y1=\"150\" x2=\"301\" y2=\"144\" stroke-width=\"0.9\"/>\n            <line x1=\"310\" y1=\"148\" x2=\"309\" y2=\"141\" stroke-width=\"0.9\"/>\n            <line x1=\"316\" y1=\"149\" x2=\"317\" y2=\"142\" stroke-width=\"0.9\"/>\n        </g>\n    </svg>"}, {"id": "lady", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Lady", "title": "Lady", "page": "37", "accent": "#7ab395", "glow": "rgba(122, 179, 149, 0.16)", "whisper": "gwiazdy na łąkach · wędrowiec i Sokół · dwadzieścia trzy", "mode": "verse", "blocks": [["Noc spłynęła gwiazdami", "Na łąki zielone pokryte różami,", "Mgłą spowite runa leśne, a wśród nich ruczajki i owady", "Wcześną wiosną obudzone,", "Trzymają wschodzącego kwiatu stronę.", "Wnet kierują swe skrzydełka,", "Swe poroża,", "W te ogrody, na te pola,", "Gdzie jagody są i woda,", "By się napić i pożywić", "Świeżym wiatrem się posilić.", "Niejasna pogoda,", "Dla wędrowca i Sokoła, burzą okryła ramiona,", "Którzy w parze bronią ścieżek", "Tych wytartych i ukrytych", "Tylko w ich umyśle,", "Jedną myślą", "W ciągu liczbą przyszłą.", "Dwadzieścia trzy."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-lady\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-lady)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Krążący Sokół -->\n            <path d=\"M182 68 Q208 52 220 66 Q232 52 258 68 Q234 64 220 74 Q206 64 182 68 Z\" fill=\"currentColor\" fill-opacity=\"0.2\" stroke-width=\"1.2\" class=\"svg-float\"/>\n            <!-- Gwiazdy spływające na łąkę -->\n            <circle cx=\"136\" cy=\"48\" r=\"1.8\" fill=\"currentColor\" class=\"svg-twinkle\"/>\n            <circle cx=\"168\" cy=\"86\" r=\"1.5\" fill=\"currentColor\" class=\"svg-twinkle\"/>\n            <circle cx=\"284\" cy=\"52\" r=\"1.8\" fill=\"currentColor\" class=\"svg-twinkle\"/>\n            <circle cx=\"268\" cy=\"92\" r=\"1.5\" fill=\"currentColor\" class=\"svg-twinkle\"/>\n            <!-- Ukryte ścieżki w łące i liczba 23 -->\n            <path d=\"M84 156 Q160 138 220 152 T356 148\" stroke-width=\"1\" opacity=\"0.6\"/>\n            <path d=\"M196 172 C210 156, 224 146, 232 132\" stroke-width=\"0.9\" stroke-dasharray=\"2 3\" opacity=\"0.65\"/>\n            <text x=\"308\" y=\"138\" fill=\"currentColor\" font-family=\"Georgia, serif\" font-style=\"italic\" font-size=\"13\" opacity=\"0.65\">23</text>\n        </g>\n    </svg>"}, {"id": "tak", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Tak", "title": "Tak", "page": "38", "accent": "#aec2d4", "glow": "rgba(174, 194, 212, 0.16)", "whisper": "woda i czas · hartowana stal · taniec we mgle", "mode": "verse", "blocks": [["Miłości moja – liczysz się tylko Ty i Twoje ramiona.", "Rodzisz moje sny, obracasz je w pył.", "Nieuchwytna jak woda i czas, hartujesz we mnie stal i leczysz mnie z", "ran.", "Nie patrzysz wstecz i tym różnisz się,", "więc kocham Cię, na jawie i we śnie,", "tańcząc we mgle."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-tak\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-tak)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Pasma mgły -->\n            <path d=\"M76 138 Q148 122 220 138 T364 134\" stroke-width=\"0.9\" opacity=\"0.4\" class=\"svg-float\"/>\n            <path d=\"M96 156 Q168 142 240 156 T348 152\" stroke-width=\"0.8\" opacity=\"0.3\" class=\"svg-float\"/>\n            <!-- Splecione linie tańca we mgle -->\n            <path d=\"M204 152 C192 122, 226 98, 212 64\" stroke-width=\"1.3\" opacity=\"0.88\"/>\n            <path d=\"M236 152 C248 122, 214 98, 228 64\" stroke-width=\"1.3\" opacity=\"0.88\"/>\n            <circle cx=\"212\" cy=\"56\" r=\"4\" stroke-width=\"1.1\"/>\n            <circle cx=\"228\" cy=\"56\" r=\"4\" stroke-width=\"1.1\"/>\n        </g>\n    </svg>"}, {"id": "wilcza", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Wilcza", "title": "Wilcza", "page": "39", "accent": "#c2695b", "glow": "rgba(194, 105, 91, 0.16)", "whisper": "rozstaje w nocy · pustynia i światło · kamień pod stopą", "mode": "prose", "blocks": [["W głębi nocy twarz wilka i cztery kopyta. Jedno przez drugie zanika, gdy życie o dumę się pyta. Możliwe, że przenikam, lecz tylko niewielu. Tu są rozstaje, a ja wciąż nie wiem, czy ze światłem przemierzyć krainę, czy do światła iść przez pustynię."], ["Spragniony wody nie dbam o zasoby."], ["Tak Teksański się zaczyna, a jakby ktoś pytał, nikt wilka nie widział, tylko krew."], ["Chyba nie mam wyboru i muszę iść dalej, gołą stopą zahaczyć ten kamień, źródło tych pragnień, przyczynę iluzji, jak kamienie na szaniec."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-wilcza\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-wilcza)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Rozstaje dróg -->\n            <path d=\"M220 174 L220 132 L148 92\" stroke-width=\"1.1\" opacity=\"0.65\"/>\n            <path d=\"M220 132 L292 92\" stroke-width=\"1.1\" opacity=\"0.65\"/>\n            <!-- Oczy wilka w głębi nocy -->\n            <path d=\"M196 58 L210 63 L200 66 Z\" fill=\"currentColor\" opacity=\"0.85\" class=\"svg-twinkle\"/>\n            <path d=\"M244 58 L230 63 L240 66 Z\" fill=\"currentColor\" opacity=\"0.85\" class=\"svg-twinkle\"/>\n            <!-- Kamień na szlaku -->\n            <polygon points=\"212,150 222,142 232,148 228,156 214,156\" fill=\"currentColor\" fill-opacity=\"0.24\" stroke-width=\"1\"/>\n            <!-- Dalekie światło nad pustynią -->\n            <circle cx=\"296\" cy=\"86\" r=\"7\" fill=\"currentColor\" fill-opacity=\"0.25\" stroke-width=\"0.9\" class=\"svg-breathe\"/>\n        </g>\n    </svg>"}, {"id": "teraz", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Teraz", "title": "Teraz", "page": "40", "accent": "#d16d79", "glow": "rgba(209, 109, 121, 0.16)", "whisper": "głos serca · chwila · czyste tętno", "mode": "verse", "blocks": [["Wysłuchałem głosu serca,", "Tym, dla których to morderca", "Życzę powodzenia,", "I niech mile mija każda chwila –", "Ludziom bez serca"]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-teraz\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-teraz)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <path d=\"M220 146 C182 118, 168 88, 188 70 C202 58, 216 68, 220 80 C224 68, 238 58, 252 70 C272 88, 258 118, 220 146 Z\" fill=\"currentColor\" fill-opacity=\"0.14\" stroke-width=\"1.25\" class=\"svg-breathe\"/>\n            <polyline points=\"82,106 176,106 192,106 204,84 216,128 228,74 238,114 248,106 358,106\" stroke-width=\"1.15\" opacity=\"0.88\"/>\n        </g>\n    </svg>"}, {"id": "podroze", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Podróże...", "title": "Podróże...", "page": "41", "accent": "#88abbe", "glow": "rgba(136, 171, 190, 0.16)", "whisper": "plecak niewyjaśnionego · wyruszanie w góry · Ziemia z wysoka", "mode": "verse", "blocks": [["Zbieram do plecaka", "niewyjaśnione,", "plecak cięższy, kiedy z mądrością opuszczam", "niewiedzy stronę.", "Wyjmuję z niego, gdy się pouczam, a zadaniem moim,", "poruszać (spokój zakłócać niedowierzanie),", "i tak z następstwa", "pożądliwości – w góry wyruszam,", "by tam spojrzeć", "na Ziemię,", "z wysoka już równą, piękną jak Katiusza.", "Bez cienia zdrady,", "że zgubiłem zasady,", "tylko pod niebem,", "doglądać ich zagłady..."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-podroze\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-podroze)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Łuk Ziemi z wysoka -->\n            <path d=\"M68 164 Q220 128 372 164\" stroke-width=\"1\" opacity=\"0.5\"/>\n            <!-- Szczyty górskie -->\n            <polyline points=\"104,154 162,92 194,122 232,62 278,116 306,88 344,154\" stroke-width=\"1.3\" opacity=\"0.88\"/>\n            <polyline points=\"232,62 222,94 238,104\" stroke-width=\"0.85\" opacity=\"0.45\"/>\n            <!-- Plecak wędrowca na grani -->\n            <rect x=\"154\" y=\"78\" width=\"10\" height=\"13\" rx=\"3\" fill=\"currentColor\" fill-opacity=\"0.25\" stroke-width=\"0.95\"/>\n        </g>\n    </svg>"}, {"id": "badz-jak", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Bądź jak", "title": "Bądź jak", "page": "42", "accent": "#7db8c4", "glow": "rgba(125, 184, 196, 0.16)", "whisper": "lodowiec · jezioro · słoneczniki · drzewa · żywa woda", "mode": "verse", "blocks": [["Bądź jak lodowiec, skromnym", "Wielkim pod powierzchnią."], ["Bądź jak rybak, wrażliwym", "Głodnym westchnienia jeziora."], ["Bądź jak słoneczniki, uważnym", "Nieskończonym mocom światłości."], ["Bądź jak drzewa, wdzięcznym", "Energicznym podmuchom wiatru"], ["Bądź jak woda, życiodajnym", "Źródłem wiecznej nadziei."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-badzjak\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-badzjak)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Linia powierzchni jeziora -->\n            <line x1=\"76\" y1=\"104\" x2=\"364\" y2=\"104\" stroke-width=\"1\" opacity=\"0.65\"/>\n            <!-- Lodowiec: skromny szczyt nad wodą, wielki pod powierzchnią -->\n            <polygon points=\"196,104 220,76 242,104\" fill=\"currentColor\" fill-opacity=\"0.22\" stroke-width=\"1.2\"/>\n            <polygon points=\"196,104 172,146 218,176 266,142 242,104\" fill=\"currentColor\" fill-opacity=\"0.1\" stroke-width=\"1.1\" stroke-dasharray=\"3 2\"/>\n            <!-- Słonecznik / światłość na niebie -->\n            <circle cx=\"298\" cy=\"58\" r=\"10\" fill=\"currentColor\" fill-opacity=\"0.2\" stroke-width=\"1.1\" class=\"svg-breathe\"/>\n            <circle cx=\"298\" cy=\"58\" r=\"16\" stroke-width=\"0.8\" stroke-dasharray=\"2 4\" opacity=\"0.6\"/>\n        </g>\n    </svg>"}, {"id": "swiatla", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Światła", "title": "Światła", "page": "43", "accent": "#db7b67", "glow": "rgba(219, 123, 103, 0.17)", "whisper": "wschód czerwonego słońca · krople rosy · szlachetne barwy czasu", "mode": "verse", "blocks": [["W okolicy gorzkich snów", "na tle wschodu czerwonego słońca", "kroplami rosy łąka", "zabłysnęła światłem blask.", "Każda kropla w niej zaklęta", "opłynęła nagi świat.", "Z kramu wspomnień tylko czas", "nadał im szlachetnych barw.", "Kiedy przyjdzie płynąć w dal,", "pozostanę mocno trwać, powieka mi nie zadrży", "na wspomnienie przeszłych dat."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-swiatla\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-swiatla)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <path d=\"M68 152 Q220 136 372 152\" stroke-width=\"1.1\" opacity=\"0.7\"/>\n            <!-- Wschodzące czerwone słońce -->\n            <path d=\"M168 144 A52 52 0 0 1 272 144\" fill=\"currentColor\" fill-opacity=\"0.2\" stroke-width=\"1.3\" class=\"svg-breathe\"/>\n            <!-- Krople rosy na źdźbłach łąki -->\n            <path d=\"M138 148 Q144 120 158 106\" stroke-width=\"1\"/>\n            <circle cx=\"159\" cy=\"105\" r=\"3\" fill=\"currentColor\" opacity=\"0.85\" class=\"svg-twinkle\"/>\n            <path d=\"M298 148 Q292 118 278 102\" stroke-width=\"1\"/>\n            <circle cx=\"277\" cy=\"101\" r=\"3\" fill=\"currentColor\" opacity=\"0.85\" class=\"svg-twinkle\"/>\n            <circle cx=\"220\" cy=\"116\" r=\"2.5\" fill=\"currentColor\" opacity=\"0.8\" class=\"svg-twinkle\"/>\n        </g>\n    </svg>"}, {"id": "los", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Los", "title": "Los", "page": "44", "accent": "#c4b69b", "glow": "rgba(196, 182, 155, 0.15)", "whisper": "słowik bez głosu · zeszyt o pustych stronach · od świtu po kres", "mode": "verse", "blocks": [["Ironia losu", "słowik bez głosu.", "Najciekawsza historia", "w zeszycie o pustych stronach.", "Z rękoma w górze", "opieram się ułudzie.", "Z tych wniosków", "zrozumieć życie", "minionych dekad", "od świtu po kres."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-los\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-los)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Otwarty zeszyt o pustych stronach -->\n            <path d=\"M148 146 L220 156 L292 146 L284 96 L220 106 L156 96 Z\" stroke-width=\"1.15\" fill=\"currentColor\" fill-opacity=\"0.08\"/>\n            <line x1=\"220\" y1=\"106\" x2=\"220\" y2=\"156\" stroke-width=\"1\"/>\n            <!-- Słowik bez głosu -->\n            <path d=\"M204 72 C212 58, 230 58, 236 70 L246 68 L238 74 C234 84, 218 86, 208 80 L194 88 L204 76 Z\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke-width=\"1.1\"/>\n        </g>\n    </svg>"}, {"id": "pora", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Pora", "title": "Pora", "page": "45", "accent": "#b8c0cf", "glow": "rgba(184, 192, 207, 0.16)", "whisper": "srebrna poświata pełni · rogi w głębi nocy · przerwany skowyt", "mode": "verse", "blocks": [["Przez noc upalnego lata", "Srebrna księżyca poświata,", "Poszedłem tropem drapieżnika", "Ciemność do głowy przenikła,", "Bosy skaleczyłem nogi.", "W głębi nocy czaiły się rogi,", "Wtem ugasiłem niedopałek pożogi,", "Wdzięczne chylą się korony.", "Tam sobie przypominam", "Kto kogo za gardło chwyta,", "Ofiar – pora na finał.", "Szkoda, że była pełnia,", "A wilczy skowyt", "Zagłuszyła strzelba."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-pora\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-pora)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Pełnia księżyca -->\n            <circle cx=\"220\" cy=\"70\" r=\"28\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke-width=\"1.25\" class=\"svg-breathe\"/>\n            <!-- Korony drzew i rogi w głębi nocy -->\n            <path d=\"M196 158 C196 136, 180 124, 174 106 M186 128 L196 116 M180 118 L166 114\" stroke-width=\"1.15\" opacity=\"0.8\"/>\n            <path d=\"M244 158 C244 136, 260 124, 266 106 M254 128 L244 116 M260 118 L274 114\" stroke-width=\"1.15\" opacity=\"0.8\"/>\n            <!-- Ostra linia huku przecinająca noc -->\n            <line x1=\"128\" y1=\"144\" x2=\"318\" y2=\"112\" stroke-width=\"0.9\" stroke-dasharray=\"8 3 2 3\" opacity=\"0.55\"/>\n        </g>\n    </svg>"}, {"id": "troski-utraconego-zycia", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Troski utraconego życia", "title": "Troski utraconego życia", "page": "46", "accent": "#dfbe7d", "glow": "rgba(223, 190, 125, 0.17)", "whisper": "słowa zmienione w czyn · tworzenie świata", "mode": "verse", "blocks": [["Damy radę ja i ty,", "odbudować sny, gdy się słowa", "zmienią w czyn."], ["~ Tam, gdzie inni widzą zwykłe słowa,", "Ty tworzysz świat."], ["KONIEC."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-troski\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-troski)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <circle cx=\"220\" cy=\"102\" r=\"44\" stroke-width=\"1.2\" opacity=\"0.85\"/>\n            <ellipse cx=\"220\" cy=\"102\" rx=\"44\" ry=\"16\" stroke-width=\"0.85\" opacity=\"0.5\"/>\n            <ellipse cx=\"220\" cy=\"102\" rx=\"16\" ry=\"44\" stroke-width=\"0.85\" opacity=\"0.5\"/>\n            <!-- Kawałki snów składające się w całość -->\n            <polygon points=\"152,126 164,118 168,130\" fill=\"currentColor\" fill-opacity=\"0.3\" class=\"svg-float\"/>\n            <polygon points=\"286,78 298,72 294,86\" fill=\"currentColor\" fill-opacity=\"0.3\" class=\"svg-float\"/>\n            <circle cx=\"220\" cy=\"102\" r=\"4\" fill=\"currentColor\" opacity=\"0.85\" class=\"svg-breathe\"/>\n        </g>\n    </svg>"}, {"id": "kims", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Kimś...", "title": "Kimś...", "page": "47", "accent": "#668cd4", "glow": "rgba(102, 140, 212, 0.18)", "whisper": "zjawa północy · paradoksalny szafir · zapach rosy", "mode": "verse", "blocks": [["Widziałem tej nocy", "Zjawę kroczącą w północy", "Przykryłaś nadzieję", "Życiem i wspomnieniem", "Duchowa pustka", "W ciele bez ducha", "Paradoksalny szafir", "Tylko Twoje włosy", "Niewrażliwe są na odgłosy", "Zapachów rosy", "I wiatru powiew"]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-kims\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-kims)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Paradoksalny szafir -->\n            <polygon points=\"220,44 248,78 236,132 204,132 192,78\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke-width=\"1.25\" class=\"svg-breathe\"/>\n            <polyline points=\"192,78 220,92 248,78\" stroke-width=\"0.85\" opacity=\"0.6\"/>\n            <line x1=\"220\" y1=\"44\" x2=\"220\" y2=\"132\" stroke-width=\"0.85\" opacity=\"0.6\"/>\n            <!-- Niewzruszone pasma włosów ponad powiewem -->\n            <path d=\"M168 154 C196 148, 244 148, 276 154\" stroke-width=\"1.1\" opacity=\"0.8\"/>\n            <path d=\"M158 164 C196 158, 244 158, 286 164\" stroke-width=\"0.9\" opacity=\"0.55\"/>\n        </g>\n    </svg>"}, {"id": "dziennik-prog", "chapter": "krag-3", "chapterLabel": "III. DziEnniK", "indexTitle": "DziEnniK · Motto otwarcia", "title": "DziEnniK", "subtitle": "Część zamykająca tomik", "page": "48", "accent": "#d4b072", "glow": "rgba(212, 176, 114, 0.17)", "whisper": "karty bez tytułów · intymny zapis pamięci", "isChapterGate": true, "mode": "verse", "blocks": [["Zaprzyjaźnił się", "świat z tymi, którym", "czegoś brak."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-dzprog\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-dzprog)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Niedomknięty okrąg („którym czegoś brak”) -->\n            <path d=\"M252 62 A54 54 0 1 0 272 118\" stroke-width=\"1.4\" opacity=\"0.88\"/>\n            <circle cx=\"266\" cy=\"86\" r=\"3\" fill=\"currentColor\" opacity=\"0.8\" class=\"svg-twinkle\"/>\n            <!-- Sygnet rombu w sercu dziennika -->\n            <polygon points=\"220,96 228,104 220,112 212,104\" fill=\"currentColor\" fill-opacity=\"0.25\" stroke-width=\"1\"/>\n        </g>\n    </svg>"}, {"id": "dziennik-i", "chapter": "krag-3", "chapterLabel": "III. DziEnniK", "indexTitle": "I · Wzbudzam oddech z mej pamięci…", "title": "DziEnniK · I", "subtitle": "„Wzbudzam oddech z mej pamięci…”", "page": "49", "accent": "#c9a875", "glow": "rgba(201, 168, 117, 0.15)", "whisper": "oddech pamięci · kolejny klucz na krańcu dróg", "mode": "prose", "blocks": [["Wzbudzam oddech z mej pamięci, zawsze stroniąc w nim od śmierci, mimo to odczuwam lęk większy niż do walki wstręt. Chciałbym poznać wizję strat, lecz to zysków boję się od lat. Nie wypowiadam wojny szczęściu, z „Ż” wiem, że leży w podejściu. Na krańcu każdej z dróg leży kolejny klucz. Tylko obojętność nie pozwala i powala na kolana, teraz spędzam chwile, dnie, aż czas dla mnie ruszy się. Dziś mam ambicje odłożyć na życie, bo gdy przyjdzie dzień, będę chciał spełnić sen."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-dzi\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-dzi)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <path d=\"M138 172 L208 86 M302 172 L232 86\" stroke-width=\"1.1\" opacity=\"0.65\"/>\n            <line x1=\"92\" y1=\"86\" x2=\"348\" y2=\"86\" stroke-width=\"0.8\" opacity=\"0.35\"/>\n            <!-- Świetlisty klucz na krańcu drogi -->\n            <circle cx=\"220\" cy=\"58\" r=\"11\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke-width=\"1.2\" class=\"svg-breathe\"/>\n            <line x1=\"220\" y1=\"69\" x2=\"220\" y2=\"98\" stroke-width=\"1.2\"/>\n            <line x1=\"220\" y1=\"88\" x2=\"228\" y2=\"88\" stroke-width=\"1.1\"/>\n            <line x1=\"220\" y1=\"95\" x2=\"226\" y2=\"95\" stroke-width=\"1.1\"/>\n        </g>\n    </svg>"}, {"id": "dziennik-ii", "chapter": "krag-3", "chapterLabel": "III. DziEnniK", "indexTitle": "II · Jesteś mi najbliższa…", "title": "DziEnniK · II", "subtitle": "„Jesteś mi najbliższa…”", "page": "50", "accent": "#7ca9a1", "glow": "rgba(124, 169, 161, 0.16)", "whisper": "niezmienny azymut · rzeka snu · leśna derń", "mode": "verse", "blocks": [["Jesteś mi najbliższa, czy masz wartość, czy nie,", "Moje życie to słowa i Ty, azymut ten od dawna nie zmienia się.", "Wiara w to nadzieją wypełnia sen i jak rzeka orzeźwia mnie", "budując każdy dzień. Przejawem pragnień dla mnie jest znosić Cię", "I w tym świetle gasić smutku cień, beznamiętnie licząc każdy cierń.", "Bieg w milionie chwil pochwycił czas, by w sekundę odmienił nas.", "Może lepsza ta kartka czysta, przejrzysta, bo słów już tyle, ile w sobie igieł zawiera leśna derń.", "W trakcie minionych chwil odpędzam czarny czar, kląc przez zęby na ten świat.", "Jeden gest lub jedna rzecz – niech skłoni serca pójścia precz.", "Każdej myśli dać dojrzałość, w płomień rzucić zwiędłą gałąź."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-dzii\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-dzii)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <circle cx=\"220\" cy=\"96\" r=\"42\" stroke-width=\"1\" opacity=\"0.6\"/>\n            <!-- Igła azymutu -->\n            <polygon points=\"220,58 227,96 220,134 213,96\" fill=\"currentColor\" fill-opacity=\"0.2\" stroke-width=\"1.2\"/>\n            <!-- Rzeka u dołu i gałązka z cierniem -->\n            <path d=\"M96 158 Q168 144 220 158 T344 156\" stroke-width=\"1\" opacity=\"0.6\"/>\n            <path d=\"M136 122 Q162 114 182 126\" stroke-width=\"0.9\" opacity=\"0.65\"/>\n            <line x1=\"154\" y1=\"118\" x2=\"150\" y2=\"111\" stroke-width=\"0.9\"/>\n            <line x1=\"168\" y1=\"120\" x2=\"172\" y2=\"113\" stroke-width=\"0.9\"/>\n        </g>\n    </svg>"}, {"id": "dziennik-iii", "chapter": "krag-3", "chapterLabel": "III. DziEnniK", "indexTitle": "III · Co jeśli przyjdzie wiosna…", "title": "DziEnniK · III", "subtitle": "„Co jeśli przyjdzie wiosna…”", "page": "51", "accent": "#9ec284", "glow": "rgba(158, 194, 132, 0.16)", "whisper": "obfita jabłoń · wiatry w góry · jemioły", "mode": "verse", "blocks": [["Co jeśli przyjdzie wiosna, a zimy już nie będzie,", "Co jeśli wyda jabłoń owoc tak obfity, że połamią się gałęzie,", "Co jeśli zobaczy kret nową ziemię i porzuci brzemię,", "Czy Ty, ślepcze, kiedyś pożegnasz noc, czy tylko siebie?"], ["Co jeśli złamię szyfr i odgadnę, żem nikt,", "Co jeśli przystanę w biegu i zacznę iść,", "Co jeśli ruszą wiatry szlakami w góry,", "Czy rozkwitną jemioły?"], ["Co jeśli opowiem o życiu bajkę,", "Co jeśli zakocham się w Marajkę,", "Co jeśli, jeśli nie On?"]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-dziii\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-dziii)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Gałąź jabłoni z obfitym owocem -->\n            <path d=\"M104 68 C168 68, 224 84, 286 118\" stroke-width=\"1.3\" opacity=\"0.85\"/>\n            <circle cx=\"196\" cy=\"94\" r=\"10\" fill=\"currentColor\" fill-opacity=\"0.2\" stroke-width=\"1.1\"/>\n            <circle cx=\"242\" cy=\"112\" r=\"11\" fill=\"currentColor\" fill-opacity=\"0.22\" stroke-width=\"1.1\"/>\n            <circle cx=\"282\" cy=\"132\" r=\"9\" fill=\"currentColor\" fill-opacity=\"0.18\" stroke-width=\"1.1\"/>\n            <!-- Szlaki wiatrów ku górom -->\n            <path d=\"M118 156 Q192 136 276 154 T352 140\" stroke-width=\"0.9\" opacity=\"0.45\" class=\"svg-float\"/>\n        </g>\n    </svg>"}, {"id": "dziennik-iv", "chapter": "krag-3", "chapterLabel": "III. DziEnniK", "indexTitle": "IV · Stepy błękitne, góry zielone…", "title": "DziEnniK · IV", "subtitle": "„Stepy błękitne, góry zielone…”", "page": "52", "accent": "#6fa3cf", "glow": "rgba(111, 163, 207, 0.16)", "whisper": "błękitne stepy · cięciwa i włócznia · iskra pochodni", "mode": "verse", "blocks": [["Stepy błękitne, góry zielone", "Wody niebieskie i niebo kolorowe.", "Jego Królestwo nie jest jałowe,", "Bo dla Ciebie było stworzone", "Wyobraźni Aniołem"], ["..."], ["Jesteś włócznią odwracającą bieg rzeki,", "Cięciwą napinającą łuk", "do strzału,", "podczas gdy mi wodą jesteś w ciemnej dolinie życia,", "pochodnią będę ronił Ci iskrę", "w bliskich dalekich odmętach czasu."], ["..."], ["Co dnia marzysz, gdzie tak pięknie, jak nie tu?", "Będzie więcej, lepiej, tylko patrz,", "gdy tak pięknie się uśmiechasz", "światła cech rozświetlasz.", "Smutku bronisz od widzenia – do widzenia,", "i to wszystko tak, z niechcenia."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-dziv\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-dziv)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Łuk i cięciwa -->\n            <path d=\"M168 54 Q212 104 168 154\" stroke-width=\"1.3\" opacity=\"0.85\"/>\n            <line x1=\"168\" y1=\"54\" x2=\"168\" y2=\"154\" stroke-width=\"0.9\" opacity=\"0.65\"/>\n            <line x1=\"162\" y1=\"104\" x2=\"226\" y2=\"104\" stroke-width=\"1.1\"/>\n            <polyline points=\"218,99 227,104 218,109\" stroke-width=\"1.1\"/>\n            <!-- Pochodnia i roniąca się iskra -->\n            <line x1=\"286\" y1=\"146\" x2=\"298\" y2=\"96\" stroke-width=\"1.3\"/>\n            <path d=\"M298 96 C292 80, 308 72, 304 58 C314 70, 312 88, 298 96 Z\" fill=\"currentColor\" fill-opacity=\"0.25\" stroke-width=\"1.1\" class=\"svg-breathe\"/>\n            <circle cx=\"278\" cy=\"116\" r=\"2.2\" fill=\"currentColor\" class=\"svg-twinkle\"/>\n        </g>\n    </svg>"}, {"id": "dziennik-v", "chapter": "krag-3", "chapterLabel": "III. DziEnniK", "indexTitle": "V · Rozkwitłaś jak kwiatu pąk…", "title": "DziEnniK · V", "subtitle": "„Rozkwitłaś jak kwiatu pąk…”", "page": "53", "accent": "#d68ca4", "glow": "rgba(214, 140, 164, 0.16)", "whisper": "rozbite szkło · pąk kwiatu · jestestwo Słowa", "mode": "prose", "blocks": [["Rozkwitłaś jak kwiatu pąk, a to, co złe rozbiło się niczym szkło. Czymże są świata powiek drgnięcia przy tych niespełnionych objęciach? Mogę – ale nie umiem, Ty umiesz – ale nie chcesz. Póki co mam jeszcze czas, by zmienić paletę barw. Lecz po co poprawiać piękno, by po to, aby pielęgnować życia piętno?"], ["Nie!"], ["Lecz to, co Słowo rzekło – jestestwo!"], ["Zapadałem w mrok, a do wyboru miałem dno albo On, więc gdy twarz ukażę, wynajdę istoty wątłe z marzeń i przeniosę je na twarze z krainy wyobrażeń (w sferę wyobrażeń). Tak mi stratny losie wynagrodzisz za me usta, aby prawdą było wszystko, czym wzgardziło me nazwisko. Póki co mam déjà vu, że wyprzedzam Cię o parę chwil, a na przyszłość chcę, byś wiedział, że to wszystko pięknie wyszło, tak jak chciałem – do widzenia."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-dzv\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-dzv)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Okruchy szkła u dołu -->\n            <polygon points=\"154,158 172,148 178,162\" stroke-width=\"0.95\" opacity=\"0.55\"/>\n            <polygon points=\"262,156 278,146 286,160\" stroke-width=\"0.95\" opacity=\"0.55\"/>\n            <polygon points=\"196,164 208,154 214,166\" stroke-width=\"0.9\" opacity=\"0.45\"/>\n            <!-- Pąk kwiatu wznoszący się ku górze -->\n            <path d=\"M220 156 V98\" stroke-width=\"1.3\"/>\n            <path d=\"M220 98 C202 88, 204 60, 220 46 C236 60, 238 88, 220 98 Z\" fill=\"currentColor\" fill-opacity=\"0.22\" stroke-width=\"1.25\" class=\"svg-breathe\"/>\n            <path d=\"M220 98 C196 96, 192 74, 206 64\" stroke-width=\"1\" opacity=\"0.7\"/>\n            <path d=\"M220 98 C244 96, 248 74, 234 64\" stroke-width=\"1\" opacity=\"0.7\"/>\n        </g>\n    </svg>"}, {"id": "dziennik-vi", "chapter": "krag-3", "chapterLabel": "III. DziEnniK", "indexTitle": "VI · Wykorzystany, słowami przemijam…", "title": "DziEnniK · VI", "subtitle": "„Wykorzystany, słowami przemijam…”", "page": "54", "accent": "#9c98ad", "glow": "rgba(156, 152, 173, 0.15)", "whisper": "czeladnik słowa · wdech i wydech · pętla współistnienia", "mode": "verse", "blocks": [["Wykorzystany, słowami przemijam,", "w roli czeladnika – ludzi czytam", "i łączę głoski w zdania", "pisząc poemat jego powstawania."], ["Ciężary niosąc, szukam odpocznienia,", "nie staję w szranki z ludźmi z cienia,", "podziwiam wytrwałość,", "samemu,", "unikam światła,", "bo trudno być „Tak”,", "i przechodzę do cienia."], ["Zapisuję na kartkach sprzeciwy istnienia, bo nauka lepsza niż dowody.", "Biorę oddech i tak zaczynam,", "początek końca,", "wydech i już mnie nie ma,", "tylko pamięć.", "Nie chwytam brzemienia,", "chyba że zacznę,", "dla współistnienia, pętla."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-dzvi\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-dzvi)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <path d=\"M220 105 C192 72, 138 72, 138 105 C138 138, 192 138, 220 105 C248 72, 302 72, 302 105 C302 138, 248 138, 220 105 Z\" stroke-width=\"1.3\" opacity=\"0.85\" class=\"svg-breathe\"/>\n            <circle cx=\"168\" cy=\"105\" r=\"16\" fill=\"currentColor\" fill-opacity=\"0.16\" stroke=\"none\"/>\n            <circle cx=\"272\" cy=\"105\" r=\"16\" stroke-width=\"0.8\" stroke-dasharray=\"2 3\" opacity=\"0.45\"/>\n        </g>\n    </svg>"}, {"id": "dziennik-vii", "chapter": "krag-3", "chapterLabel": "III. DziEnniK", "indexTitle": "VII · W miłej ciszy lekkich kropel…", "title": "DziEnniK · VII", "subtitle": "„W miłej ciszy lekkich kropel dźwięki…”", "page": "55", "accent": "#82b4bd", "glow": "rgba(130, 180, 189, 0.16)", "whisper": "lekkie krople · tęcza tęsknoty · Prawda Naga", "mode": "prose", "blocks": [["W miłej ciszy lekkich kropel dźwięki,"], ["wiodą imię tej panienki."], ["Czy to strach jej tak gorliwie zakrył drzewa nieuczciwie? Czy tęsknota lub jej brak stworzą tęczę, mówiąc „Tak”? Tempo zwalnia, wiatr się wzmaga, myśleć już mi nie pomaga. Prawda Naga."], ["Szerokości powątpiewań sują liście, lecąc z góry, jak w Tych Trenach swoim słowem burzą mury. Wszak cierpliwość jest w naturze, to jej brak przez zazdrość chełpi Twe kałuże."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-dzvii\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-dzvii)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Łuk tęczy -->\n            <path d=\"M128 148 A92 76 0 0 1 312 148\" stroke-width=\"1.15\" opacity=\"0.75\"/>\n            <path d=\"M140 148 A80 64 0 0 1 300 148\" stroke-width=\"0.8\" opacity=\"0.4\"/>\n            <!-- Lekkie krople -->\n            <circle cx=\"196\" cy=\"96\" r=\"2\" fill=\"currentColor\" opacity=\"0.75\" class=\"svg-twinkle\"/>\n            <circle cx=\"220\" cy=\"84\" r=\"2.2\" fill=\"currentColor\" opacity=\"0.85\" class=\"svg-twinkle\"/>\n            <circle cx=\"244\" cy=\"98\" r=\"2\" fill=\"currentColor\" opacity=\"0.75\" class=\"svg-twinkle\"/>\n            <!-- Pęknięty mur u dołu -->\n            <line x1=\"146\" y1=\"158\" x2=\"204\" y2=\"158\" stroke-width=\"1.1\" opacity=\"0.5\"/>\n            <line x1=\"236\" y1=\"158\" x2=\"294\" y2=\"158\" stroke-width=\"1.1\" opacity=\"0.5\"/>\n        </g>\n    </svg>"}, {"id": "dziennik-viii", "chapter": "krag-3", "chapterLabel": "III. DziEnniK", "indexTitle": "VIII · Dodatki odłóżmy, w objęcia…", "title": "DziEnniK · VIII", "subtitle": "„Dodatki odłóżmy, w objęcia weźmy siebie…”", "page": "56", "accent": "#de9b5c", "glow": "rgba(222, 155, 92, 0.17)", "whisper": "tango w ogniu · klucz węgielny · Na Szczycie", "mode": "prose", "blocks": [["Dodatki odłóżmy, w objęcia weźmy siebie, taniec porwie nas w muzykę lekką, graną w namiętności naszych serc, a gdy potknięć już nie będzie – słońce wzejdzie."], ["Jeden oddech, jeden powód, kręćmy w koło się na pięć, wiele dałbym z Tobą być."], ["Uśmiech mówi wszystko, od ucha do ucha rozszerza się i rumieni, bo to tajnik poznania bez nieszczerego doznania. Ten klucz jest węgielny, z ciemności wyciągnięty, cenny."], ["W smutku i radości, w spokoju i złości myślę o Tobie z miłości. Takie tango tańczę raz, póki ogień płonie w nas."], ["Pytań jest wiele, lecz tylko jedno ważne, to takie zabawne, choć proste i jasne, odpowiedź na wszystko."], ["Nie dosięgnie nas mrok, w śmierci znajdę skarb, gdybym miał umierać rok, i urodzi się życie, gdy będziemy Na Szczycie. Nowe początki i bez końca wątki to tajemnice niczym Ulice, raz lepsze, raz gorsze, już przykład im dałaś, jak zatańczyć chciałaś."], ["To do Ciebie mam szczęście, więc dobrze będzie"]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-dzviii\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-dzviii)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Szczyt i słońce -->\n            <polyline points=\"124,164 220,82 316,164\" stroke-width=\"1.15\" opacity=\"0.75\"/>\n            <circle cx=\"220\" cy=\"58\" r=\"15\" fill=\"currentColor\" fill-opacity=\"0.22\" stroke-width=\"1.2\" class=\"svg-breathe\"/>\n            <!-- Spirala tanga i klucz węgielny -->\n            <path d=\"M196 154 C208 132, 232 132, 220 112 C210 96, 230 92, 220 82\" stroke-width=\"1.1\" opacity=\"0.85\"/>\n            <polygon points=\"220,136 227,144 220,152 213,144\" fill=\"currentColor\" fill-opacity=\"0.28\" stroke-width=\"1\"/>\n        </g>\n    </svg>"}, {"id": "dziennik-ix", "chapter": "krag-3", "chapterLabel": "III. DziEnniK", "indexTitle": "IX · Obok kałamarza i obok wikliny…", "title": "DziEnniK · IX", "subtitle": "„Obok kałamarza i obok wikliny…”", "page": "57–58", "accent": "#b89f74", "glow": "rgba(184, 159, 116, 0.16)", "whisper": "kałamarz i wiklina · mogiła żalu i Ren · miłość, a nie czas", "mode": "verse", "blocks": [["Obok kałamarza i obok wikliny odlicza czas samotne godziny,", "Na przemian pełnię i brzask formuje z tej samej gliny.", "W otchłań bezdenną zabiera istotne, co w istocie – nieistotne,", "Karząc za błędy, lecz płacząc zalotnie.", "Co będę mógł powiedzieć o sobie?"], ["Mogiła żalu otwiera Ren,", "A na jej prochach powstaje dźwięk.", "Z niczego – coś, z początku – w tren", "Opiewa nocą wdzięk, by ze świtem przegonić lęk."], ["Określa milczenie wymowne wody wrzenie, Niewezbranej duszy", "głos pielęgnuje to natchnieniem,", "Raczy u drzwi progu weselnym przywitać brzmieniem", "Kogoś, kto potrafi czekać na ostatnie tchnienie.", "Co będę mógł powiedzieć o sobie?"], ["Mogiła żalu otwiera Ren,", "A na jej prochach powstaje dźwięk.", "Z niczego – coś, z początku – w tren", "Opiewa nocą wdzięk, by ze świtem przegonić lęk."], ["Dwojako sen się układał,", "Poczułem tej nocy, jak w gęstwinie upadam,", "Lecz dalej tym wierszom dla „Cię” porządek składam,", "A lata na sekundy z Tobą bym wywładał."], ["Mogiła żalu otwiera Ren,", "A na jej prochach powstaje dźwięk.", "Z niczego – coś, z początku – w tren", "Opiewa nocą wdzięk, by ze świtem przegonić lęk."], ["Jakże kolaśnie objawił się czas, w ułamku sekundy", "Przeprawił przez ciemność – przez las,", "Z tych uczuć rotundy rozebrzmiał blask", "Co pozwala spoglądać w dal, to jest miłość, a nie czas."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-dzix\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-dzix)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Wstęga Renu -->\n            <path d=\"M78 154 C148 134, 232 172, 362 142\" stroke-width=\"1.15\" opacity=\"0.75\"/>\n            <!-- Kałamarz i pióro -->\n            <rect x=\"156\" y=\"114\" width=\"26\" height=\"22\" rx=\"3\" fill=\"currentColor\" fill-opacity=\"0.16\" stroke-width=\"1.1\"/>\n            <line x1=\"163\" y1=\"114\" x2=\"175\" y2=\"114\" stroke-width=\"1.3\"/>\n            <path d=\"M170 114 C178 88, 194 72, 206 64\" stroke-width=\"1.1\"/>\n            <!-- Gałązki wikliny po prawej -->\n            <path d=\"M278 152 Q284 108 264 78\" stroke-width=\"1\" opacity=\"0.7\"/>\n            <path d=\"M286 152 Q298 112 314 86\" stroke-width=\"1\" opacity=\"0.65\"/>\n            <!-- Pełnia i brzask -->\n            <circle cx=\"236\" cy=\"64\" r=\"12\" stroke-width=\"1\" opacity=\"0.65\"/>\n        </g>\n    </svg>"}, {"id": "dziennik-x", "chapter": "krag-3", "chapterLabel": "III. DziEnniK", "indexTitle": "X · Widziałem Cię, niby piękny sen…", "title": "DziEnniK · X", "subtitle": "„Widziałem Cię, niby piękny sen radosny…”", "page": "59", "accent": "#9eb5db", "glow": "rgba(158, 181, 219, 0.16)", "whisper": "aleje marzeń · miliony gwiazd · obiekt lśniący dla tonących", "mode": "prose", "blocks": [["Widziałem Cię, niby piękny sen radosny spełnił się mój dzień. Bywał trudny z pozoru, tylko nudny – wydał się okrutny. Pasja barw przykryła obraz ten, przemijając ostro razem z dniem."], ["Delikatne ich pejzaże miewam dziś w alejach marzeń, daleki od tych wyobrażeń, czekam na rozwój wydarzeń. Przymilkła melodia znów odgrywa sens w tych zwrotkach, lecz tym razem jakby milej, może mniej zawile, sprawi, że ulecą znów motyle. Niebo raz za razem odsłania swe ołtarze, a ja, uwikłany w te wiraże, myślę, czy kiedyś znowu zasnę..."], ["Może dziś zasnuje wiatr miliony gwiazd, miękką chmurką odsłaniając obiekt lśniący, tym tonącym drogę wskazujący."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-dzx\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-dzx)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Lśniący obiekt przewodni -->\n            <polygon points=\"220,42 225,58 242,63 225,68 220,84 215,68 198,63 215,58\" fill=\"currentColor\" fill-opacity=\"0.28\" stroke-width=\"1.1\" class=\"svg-breathe\"/>\n            <!-- Miękka chmurka odsłaniająca gwiazdę -->\n            <path d=\"M148 92 Q166 78 186 86 Q204 76 222 88 H144 Z\" fill=\"currentColor\" fill-opacity=\"0.12\" stroke-width=\"0.95\" class=\"svg-float\"/>\n            <!-- Gwiazdy i odbicie w wodzie -->\n            <circle cx=\"132\" cy=\"54\" r=\"1.6\" fill=\"currentColor\" class=\"svg-twinkle\"/>\n            <circle cx=\"298\" cy=\"48\" r=\"1.8\" fill=\"currentColor\" class=\"svg-twinkle\"/>\n            <circle cx=\"318\" cy=\"76\" r=\"1.5\" fill=\"currentColor\" class=\"svg-twinkle\"/>\n            <line x1=\"96\" y1=\"152\" x2=\"344\" y2=\"152\" stroke-width=\"0.95\" opacity=\"0.5\"/>\n            <line x1=\"208\" y1=\"160\" x2=\"232\" y2=\"160\" stroke-width=\"0.9\" opacity=\"0.6\"/>\n            <line x1=\"214\" y1=\"168\" x2=\"226\" y2=\"168\" stroke-width=\"0.8\" opacity=\"0.4\"/>\n        </g>\n    </svg>"}, {"id": "dziennik-xi-koda", "chapter": "krag-3", "chapterLabel": "III. DziEnniK", "indexTitle": "XI · Nie tylko, zawsze otwieraj oczy…", "title": "DziEnniK · XI", "subtitle": "Przesłanie końcowe", "page": "60", "accent": "#e6cf97", "glow": "rgba(230, 207, 151, 0.18)", "whisper": "sens dnia i nocy · śpiew ptaków · milczenie · szczerość · wybaczenie", "mode": "verse", "blocks": [["..."], ["Nie tylko, zawsze", "otwieraj oczy,", "by pochwycić sens", "dnia i nocy.", "Słuchaj ptaków śpiewu,", "one dla Ciebie", "wzlatują ku niebu.", "Milczenia nie przerywaj.", "Szczerości nie zdradzaj.", "Wybaczaj..."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-dzxi\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-dzxi)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Otwarte oko dnia i nocy -->\n            <path d=\"M156 118 Q220 76 284 118 Q220 160 156 118 Z\" stroke-width=\"1.3\" opacity=\"0.88\"/>\n            <circle cx=\"220\" cy=\"118\" r=\"16\" stroke-width=\"1.1\"/>\n            <path d=\"M220 102 A16 16 0 0 1 220 134 Z\" fill=\"currentColor\" fill-opacity=\"0.25\"/>\n            <!-- Ptaki wzlatujące ku niebu -->\n            <path d=\"M182 66 Q192 56 200 64 Q208 56 218 66\" stroke-width=\"1.1\" opacity=\"0.75\" class=\"svg-float\"/>\n            <path d=\"M228 48 Q238 38 246 46 Q254 38 264 48\" stroke-width=\"1.15\" opacity=\"0.85\" class=\"svg-float\"/>\n            <path d=\"M276 68 Q284 60 290 66 Q296 60 304 68\" stroke-width=\"0.95\" opacity=\"0.6\" class=\"svg-float\"/>\n        </g>\n    </svg>"}];

      const CHAPTER_META = [
        { key: "prog", label: "Próg Księgi" },
        { key: "krag-1", label: "I. Niezawiść · Ogień i światło" },
        { key: "krag-2", label: "II. Artefakty · Wiersze (37)" },
        { key: "krag-3", label: "III. DziEnniK (12)" }
      ];

      let currentIndex = 0;
      let collapsedChapters = {};
      let searchQuery = "";
      let fontScale = parseFloat(localStorage.getItem("artefakty_font_scale") || "1") || 1;
      document.documentElement.style.setProperty("--poem-scale", String(fontScale));

      const indexScroll = document.getElementById("indexScroll");
      const poemSheet = document.getElementById("poemSheet");
      const stageCrumb = document.getElementById("stageCrumb");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const prevTitle = document.getElementById("prevTitle");
      const nextTitle = document.getElementById("nextTitle");
      const searchInput = document.getElementById("searchInput");
      const searchClearBtn = document.getElementById("searchClearBtn");
      const focusToggleBtn = document.getElementById("focusToggleBtn");
      const coverModal = document.getElementById("coverModal");

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function poemMatchesQuery(poem, q) {
        if (!q) return true;
        const needle = q.toLowerCase();
        if ((poem.title || "").toLowerCase().includes(needle)) return true;
        if ((poem.indexTitle || "").toLowerCase().includes(needle)) return true;
        if ((poem.subtitle || "").toLowerCase().includes(needle)) return true;
        if ((poem.epigraph || "").toLowerCase().includes(needle)) return true;
        for (const blk of (poem.blocks || [])) {
          for (const line of blk) {
            if (line.toLowerCase().includes(needle)) return true;
          }
        }
        return false;
      }

      function renderIndex() {
        const q = searchQuery.trim();
        let html = "";
        let totalFound = 0;

        CHAPTER_META.forEach(ch => {
          const items = POEMS
            .map((p, idx) => ({ poem: p, idx }))
            .filter(entry => entry.poem.chapter === ch.key && poemMatchesQuery(entry.poem, q));

          if (items.length === 0) return;
          totalFound += items.length;

          const isCollapsed = !q && !!collapsedChapters[ch.key];
          html += `<section class="chapter-group ${isCollapsed ? "collapsed" : ""}" data-ch="${ch.key}">`;
          html += `<button type="button" class="chapter-header" data-toggle-ch="${ch.key}">
            <span>${escapeHtml(ch.label)}</span>
            <span class="chapter-header__chev">▾</span>
          </button>`;
          html += `<ul class="chapter-list">`;
          items.forEach(({ poem, idx }) => {
            const active = idx === currentIndex ? "active" : "";
            html += `<li>
              <button type="button" class="tab-item ${active}" data-idx="${idx}">
                <span class="tab-item__dot" style="background:${poem.accent}"></span>
                <span class="tab-item__title">${escapeHtml(poem.indexTitle)}</span>
                <span class="tab-item__page">s. ${escapeHtml(poem.page)}</span>
              </button>
            </li>`;
          });
          html += `</ul></section>`;
        });

        if (totalFound === 0) {
          html = `<div class="empty-search">Brak wiersza zawierającego „${escapeHtml(q)}”.</div>`;
        }

        indexScroll.innerHTML = html;
      }

      function renderPoem(idx, updateHash = true, scrollTop = true) {
        if (idx < 0 || idx >= POEMS.length) idx = 0;
        currentIndex = idx;
        const p = POEMS[idx];

        // Aktualizacja nastroju świetlnego pod dany wiersz
        document.documentElement.style.setProperty("--poem-accent", p.accent);
        document.documentElement.style.setProperty("--poem-glow", p.glow);

        document.title = idx === 0
          ? "Artefakty samotności — Mateusz Formicki"
          : `${p.title} · Artefakty samotności`;

        stageCrumb.textContent = `${p.chapterLabel} · zakładka ${idx + 1} z ${POEMS.length}`;

        // Ponowne uruchomienie delikatnej animacji karty
        poemSheet.className = "poem-sheet" + (p.isChapterGate ? " poem-sheet--gate" : "");
        void poemSheet.offsetWidth;

        if (p.isThreshold) {
          poemSheet.innerHTML = `
            <div class="threshold-view">
              <div class="illustration-wrap">
                ${p.svg}
                <div class="illustration-whisper">${escapeHtml(p.whisper)}</div>
              </div>

              <div class="threshold-author">Mateusz Formicki</div>
              <h1 class="threshold-main-title">Artefakty <em>samotności</em></h1>
              <div class="threshold-genre">T O M I K &nbsp; P O E Z J I</div>

              <p class="threshold-cycle">${escapeHtml(p.subtitle)}</p>
              <p class="threshold-edition">Wydanie 3 poprawione · Wszystkie prawa zastrzeżone · © 2026 Rybnik</p>

              <div class="threshold-dedication">Dla Ciebie</div>

              <div class="threshold-cta-row">
                <button type="button" class="primary-enter-btn" data-goto="1">Rozpocznij podróż od Prologu →</button>
                <button type="button" class="secondary-enter-btn" id="thresholdCoverBtn">◇ Zobacz okładkę wydania</button>
                <a href="Artefakty_samotnosci_tomik_A5_poprawiony.pdf" download class="secondary-enter-btn">↓ Pobierz PDF (A5)</a>
              </div>

              <div class="threshold-chapters">
                <div class="chapter-card" data-goto="1" role="button" tabindex="0">
                  <span class="chapter-card__num">Krąg I · str. 3–10</span>
                  <span class="chapter-card__name">Niezawiść</span>
                  <span class="chapter-card__desc">Droga przez ogień i światło — od przedświtu modlitwy po pamiętnicę.</span>
                </div>
                <div class="chapter-card" data-goto="6" role="button" tabindex="0">
                  <span class="chapter-card__num">Krąg II · str. 11–47</span>
                  <span class="chapter-card__name">Artefakty</span>
                  <span class="chapter-card__desc">37 osobnych światów poetyckich — od „Milczącym Głosem” po „Kimś…”.</span>
                </div>
                <div class="chapter-card" data-goto="43" role="button" tabindex="0">
                  <span class="chapter-card__num">Krąg III · str. 48–60</span>
                  <span class="chapter-card__name">DziEnniK</span>
                  <span class="chapter-card__desc">Intymne karty bez tytułów dla tych, którym czegoś brak.</span>
                </div>
              </div>
            </div>
          `;
        } else {
          let bodyHtml = "";
          if (p.mode === "prose") {
            bodyHtml += `<div class="poem-body poem-body--prose">`;
            (p.blocks || []).forEach(blk => {
              const text = blk.join(" ");
              const isShort = text === "..." || text === "Amen." || text === "Nie!";
              bodyHtml += `<p class="prose-para ${isShort ? "prose-para--short" : ""}">${escapeHtml(text)}</p>`;
            });
            bodyHtml += `</div>`;
          } else {
            bodyHtml += `<div class="poem-body poem-body--verse">`;
            (p.blocks || []).forEach(stanza => {
              bodyHtml += `<div class="stanza">`;
              stanza.forEach(line => {
                bodyHtml += `<p class="verse-line">${escapeHtml(line)}</p>`;
              });
              bodyHtml += `</div>`;
            });
            bodyHtml += `</div>`;
          }

          const gateBtn = p.isChapterGate
            ? `<div style="text-align:center;margin-top:24px;"><button type="button" class="primary-enter-btn" data-goto="${idx + 1}">Otwórz pierwszą kartę DziEnniKa →</button></div>`
            : "";

          poemSheet.innerHTML = `
            <div class="illustration-wrap">
              ${p.svg}
              <div class="illustration-whisper">${escapeHtml(p.whisper)}</div>
            </div>

            <header class="poem-header">
              <h1 class="poem-title">${escapeHtml(p.title)}</h1>
              ${p.subtitle ? `<p class="poem-subtitle">${escapeHtml(p.subtitle)}</p>` : ""}
              ${p.epigraph ? `<p class="poem-epigraph">${escapeHtml(p.epigraph)}</p>` : ""}
            </header>

            ${bodyHtml}
            ${gateBtn}

            <footer class="sheet-colophon">
              <span class="sheet-colophon__fleuron">— ◇ —</span>
              <span class="sheet-colophon__page">str. ${escapeHtml(p.page)}</span>
            </footer>
          `;
        }

        // Aktualizacja przycisków poprzedni / następny
        if (idx > 0) {
          prevBtn.disabled = false;
          prevTitle.textContent = POEMS[idx - 1].indexTitle;
        } else {
          prevBtn.disabled = true;
          prevTitle.textContent = "Początek księgi";
        }

        if (idx < POEMS.length - 1) {
          nextBtn.disabled = false;
          nextTitle.textContent = POEMS[idx + 1].indexTitle;
        } else {
          nextBtn.disabled = true;
          nextTitle.textContent = "Ostatnia karta";
        }

        renderIndex();

        // Przewiń aktywną zakładkę w bocznym indeksie do widoku
        const activeBtn = indexScroll.querySelector(".tab-item.active");
        if (activeBtn) {
          activeBtn.scrollIntoView({ block: "nearest" });
        }

        if (updateHash) {
          const targetHash = "#" + p.id;
          if (window.location.hash !== targetHash) {
            history.pushState(null, "", targetHash);
          }
        }

        if (scrollTop) {
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        document.body.classList.remove("drawer-open");
      }

      function resolveHashIndex() {
        const h = decodeURIComponent((window.location.hash || "").replace(/^#/, "")).trim();
        if (!h) return 0;
        const found = POEMS.findIndex(p => p.id === h);
        return found >= 0 ? found : 0;
      }

      // Nasłuchiwanie kliknięć w indeksie
      indexScroll.addEventListener("click", function(e) {
        const toggleBtn = e.target.closest("[data-toggle-ch]");
        if (toggleBtn) {
          const ch = toggleBtn.getAttribute("data-toggle-ch");
          collapsedChapters[ch] = !collapsedChapters[ch];
          renderIndex();
          return;
        }
        const tabBtn = e.target.closest("[data-idx]");
        if (tabBtn) {
          renderPoem(parseInt(tabBtn.getAttribute("data-idx"), 10));
        }
      });

      // Kliknięcia wewnątrz karty (np. na Progu Księgi)
      poemSheet.addEventListener("click", function(e) {
        const gotoEl = e.target.closest("[data-goto]");
        if (gotoEl) {
          renderPoem(parseInt(gotoEl.getAttribute("data-goto"), 10));
          return;
        }
        if (e.target.closest("#thresholdCoverBtn")) {
          coverModal.classList.add("open");
        }
      });

      poemSheet.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.key === " ") {
          const gotoEl = e.target.closest("[data-goto]");
          if (gotoEl) {
            e.preventDefault();
            renderPoem(parseInt(gotoEl.getAttribute("data-goto"), 10));
          }
        }
      });

      document.getElementById("brandHomeBtn").addEventListener("click", function() {
        renderPoem(0);
      });

      prevBtn.addEventListener("click", function() {
        if (currentIndex > 0) renderPoem(currentIndex - 1);
      });

      nextBtn.addEventListener("click", function() {
        if (currentIndex < POEMS.length - 1) renderPoem(currentIndex + 1);
      });

      // Strzałki klawiatury
      document.addEventListener("keydown", function(e) {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
        if (e.key === "Escape" && coverModal.classList.contains("open")) {
          coverModal.classList.remove("open");
          return;
        }
        if (e.key === "ArrowRight" && currentIndex < POEMS.length - 1) {
          renderPoem(currentIndex + 1);
        } else if (e.key === "ArrowLeft" && currentIndex > 0) {
          renderPoem(currentIndex - 1);
        }
      });

      // Wyszukiwarka
      searchInput.addEventListener("input", function() {
        searchQuery = searchInput.value;
        searchClearBtn.classList.toggle("visible", searchQuery.length > 0);
        renderIndex();
      });

      searchClearBtn.addEventListener("click", function() {
        searchInput.value = "";
        searchQuery = "";
        searchClearBtn.classList.remove("visible");
        renderIndex();
        searchInput.focus();
      });

      // Tryb skupienia (ukrywanie indeksu na desktopie)
      focusToggleBtn.addEventListener("click", function() {
        const active = document.body.classList.toggle("focus-mode");
        focusToggleBtn.textContent = active ? "⇥ Spis wierszy" : "⇤ Skupienie";
      });

      // Szuflada mobilna
      document.getElementById("mobileMenuBtn").addEventListener("click", function() {
        document.body.classList.add("drawer-open");
      });
      document.getElementById("mobileCloseBtn").addEventListener("click", function() {
        document.body.classList.remove("drawer-open");
      });
      document.getElementById("drawerBackdrop").addEventListener("click", function() {
        document.body.classList.remove("drawer-open");
      });

      // Rozmiar liter
      document.getElementById("fontDecBtn").addEventListener("click", function() {
        fontScale = Math.max(0.85, Math.round((fontScale - 0.08) * 100) / 100);
        document.documentElement.style.setProperty("--poem-scale", String(fontScale));
        localStorage.setItem("artefakty_font_scale", String(fontScale));
      });
      document.getElementById("fontIncBtn").addEventListener("click", function() {
        fontScale = Math.min(1.35, Math.round((fontScale + 0.08) * 100) / 100);
        document.documentElement.style.setProperty("--poem-scale", String(fontScale));
        localStorage.setItem("artefakty_font_scale", String(fontScale));
      });

      // Modal okładki
      document.getElementById("openCoverBtn").addEventListener("click", function() {
        coverModal.classList.add("open");
      });
      document.getElementById("closeCoverBtn").addEventListener("click", function() {
        coverModal.classList.remove("open");
      });
      coverModal.addEventListener("click", function(e) {
        if (e.target === coverModal) coverModal.classList.remove("open");
      });

      window.addEventListener("hashchange", function() {
        const idx = resolveHashIndex();
        if (idx !== currentIndex) {
          renderPoem(idx, false, true);
        }
      });

      // Inicjalizacja
      renderPoem(resolveHashIndex(), false, false);
    })();
  </script>
</body>
</html>
