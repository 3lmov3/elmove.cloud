  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --bg-deep: #0b0a08;
      --bg-panel: #12100d;
      --bg-sheet: rgba(20, 18, 14, 0.78);
      --gold: #c6a96a;
      --gold-bright: #ead6a0;
      --gold-dim: rgba(198, 169, 106, 0.28);
      --line: rgba(198, 169, 106, 0.16);
      --text-main: #f2ece1;
      --text-soft: #cfc6b6;
      --text-muted: #938a7a;
      --poem-accent: #c6a96a;
      --poem-glow: rgba(198, 169, 106, 0.16);
      --font-serif: "Cormorant Garamond", "EB Garamond", Garamond, Georgia, "Times New Roman", serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --poem-scale: 1;
      --sidebar-w: 334px;
    }

    html {
      background: var(--bg-deep);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: var(--font-serif);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Dynamiczna poświata dopasowana do brzmienia aktywnego wiersza */
    .ambient-aura {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 68% 54% at 62% 24%, var(--poem-glow), transparent 70%),
        radial-gradient(ellipse 50% 45% at 20% 85%, rgba(198, 169, 106, 0.04), transparent 65%);
      transition: background 0.8s ease;
    }

    .sanctuary-layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      min-height: 100vh;
      transition: grid-template-columns 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.focus-mode .sanctuary-layout {
      grid-template-columns: 0px minmax(0, 1fr);
    }

    /* ================= BOCZNY INDEKS KSIĘGI ================= */
    .sanctuary-index {
      position: sticky;
      top: 0;
      height: 100vh;
      width: var(--sidebar-w);
      background: linear-gradient(180deg, rgba(19, 17, 13, 0.97), rgba(12, 11, 9, 0.98));
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
      z-index: 30;
    }

    body.focus-mode .sanctuary-index {
      transform: translateX(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .index-brand {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--line);
    }

    .index-brand__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .index-brand__home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      padding: 0;
      color: var(--text-main);
      font-family: var(--font-serif);
      cursor: pointer;
      text-align: left;
    }

    .index-brand__emblem {
      width: 26px;
      height: 26px;
      color: var(--gold);
      flex-shrink: 0;
    }

    .index-brand__title {
      display: block;
      font-size: 1.24rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      line-height: 1.1;
      color: var(--gold-bright);
    }

    .index-brand__title em {
      font-style: italic;
      font-weight: 400;
    }

    .index-brand__author {
      display: block;
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .mobile-close-btn {
      display: none;
      background: none;
      border: 1px solid var(--line);
      color: var(--text-soft);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 1rem;
    }

    .index-search {
      position: relative;
      margin-top: 14px;
    }

    .index-search input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(198, 169, 106, 0.22);
      border-radius: 8px;
      padding: 8px 30px 8px 12px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.25s ease, background 0.25s ease;
    }

    .index-search input::placeholder {
      color: var(--text-muted);
    }

    .index-search input:focus {
      border-color: var(--gold);
      background: rgba(255, 255, 255, 0.05);
    }

    .index-search__clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
      padding: 2px 6px;
      display: none;
    }

    .index-search__clear.visible {
      display: block;
    }

    .index-scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 12px 10px 18px;
      scrollbar-width: thin;
      scrollbar-color: rgba(198, 169, 106, 0.25) transparent;
    }

    .index-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .index-scroll::-webkit-scrollbar-thumb {
      background: rgba(198, 169, 106, 0.25);
      border-radius: 99px;
    }

    .chapter-group {
      margin-bottom: 14px;
    }

    .chapter-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: none;
      border: none;
      padding: 7px 10px;
      color: var(--gold);
      font-family: var(--font-sans);
      font-size: 0.69rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
      border-radius: 6px;
      transition: background 0.2s ease;
    }

    .chapter-header:hover {
      background: rgba(198, 169, 106, 0.06);
    }

    .chapter-header__chev {
      font-size: 0.7rem;
      opacity: 0.7;
      transition: transform 0.25s ease;
    }

    .chapter-group.collapsed .chapter-header__chev {
      transform: rotate(-90deg);
    }

    .chapter-group.collapsed .chapter-list {
      display: none;
    }

    .chapter-list {
      list-style: none;
      margin: 3px 0 0;
      padding: 0;
    }

    .tab-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px 7px 12px;
      margin: 1px 0;
      background: transparent;
      border: none;
      border-left: 2px solid transparent;
      border-radius: 0 7px 7px 0;
      color: var(--text-soft);
      font-family: var(--font-serif);
      font-size: 0.98rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .tab-item:hover {
      background: rgba(255, 255, 255, 0.035);
      color: #ffffff;
    }

    .tab-item.active {
      background: linear-gradient(90deg, rgba(198, 169, 106, 0.14), rgba(198, 169, 106, 0.02));
      border-left-color: var(--poem-accent);
      color: var(--gold-bright);
    }

    .tab-item__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      opacity: 0.65;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .tab-item.active .tab-item__dot {
      opacity: 1;
      transform: scale(1.3) rotate(45deg);
      border-radius: 1px;
    }

    .tab-item__title {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.25;
    }

    .tab-item__page {
      flex: 0 0 auto;
      font-family: var(--font-sans);
      font-size: 0.67rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .empty-search {
      padding: 20px 14px;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    .index-footer {
      padding: 13px 16px 16px;
      border-top: 1px solid var(--line);
      background: rgba(10, 9, 7, 0.9);
      display: flex;
      flex-direction: column;
      gap: 9px;
      font-family: var(--font-sans);
    }

    .index-footer__actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .index-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid var(--gold-dim);
      background: rgba(198, 169, 106, 0.06);
      color: var(--gold-bright);
      font-family: var(--font-sans);
      font-size: 0.73rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .index-btn:hover {
      background: rgba(198, 169, 106, 0.15);
      border-color: var(--gold);
    }

    .index-footer__links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.73rem;
      color: var(--text-muted);
      padding-top: 2px;
    }

    .index-footer__links a {
      color: var(--text-soft);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .index-footer__links a:hover {
      color: var(--gold-bright);
    }

    /* ================= GŁÓWNA SCENA WIERSZA ================= */
    .sanctuary-stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 clamp(16px, 4vw, 56px) 64px;
    }

    .stage-bar {
      position: sticky;
      top: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      margin-bottom: 18px;
      background: linear-gradient(180deg, rgba(11, 10, 8, 0.92) 60%, rgba(11, 10, 8, 0));
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-family: var(--font-sans);
    }

    .stage-bar__left,
    .stage-bar__right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bar-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      color: var(--text-soft);
      border-radius: 999px;
      padding: 6px 12px;
      font-family: var(--font-sans);
      font-size: 0.74rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
    }

    .bar-btn:hover {
      border-color: var(--gold-dim);
      color: var(--gold-bright);
      background: rgba(198, 169, 106, 0.08);
    }

    .mobile-menu-btn {
      display: none;
    }

    .stage-crumb {
      font-size: 0.74rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-left: 6px;
    }

    /* ================= KARTA ZAKŁADKI / WIERSZA ================= */
    .poem-sheet {
      width: min(760px, 100%);
      margin: 0 auto;
      background: var(--bg-sheet);
      border: 1px solid rgba(198, 169, 106, 0.16);
      border-radius: 18px;
      padding: clamp(26px, 5vw, 56px) clamp(22px, 6vw, 68px);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.62),
        inset 0 1px 0 rgba(255, 244, 214, 0.05);
      animation: sheetFade 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes sheetFade {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Ilustracja dedykowana wierszowi */
    .illustration-wrap {
      text-align: center;
      margin-bottom: 26px;
      color: var(--poem-accent);
      transition: color 0.6s ease;
    }

    .poem-svg {
      width: min(420px, 100%);
      height: auto;
      display: block;
      margin: 0 auto;
      overflow: visible;
    }

    .illustration-whisper {
      margin-top: 6px;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0.82;
    }

    /* Delikatny, kontemplacyjny ruch w ilustracjach */
    @media (prefers-reduced-motion: no-preference) {
      .svg-breathe {
        transform-origin: center;
        animation: slowBreathe 8s ease-in-out infinite;
      }
      .svg-float {
        animation: slowFloat 9s ease-in-out infinite;
      }
      .svg-twinkle {
        animation: slowTwinkle 5.5s ease-in-out infinite;
      }
    }

    @keyframes slowBreathe {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.035); }
    }
    @keyframes slowFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3.5px); }
    }
    @keyframes slowTwinkle {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.95; }
    }

    /* Nagłówek wiersza */
    .poem-header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(198, 169, 106, 0.15);
    }

    .poem-title {
      margin: 0;
      font-size: calc(clamp(1.9rem, 3.8vw, 2.75rem) * var(--poem-scale));
      font-weight: 500;
      color: var(--gold-bright);
      letter-spacing: 0.02em;
      line-height: 1.18;
    }

    .poem-subtitle {
      margin: 10px 0 0;
      font-size: calc(1.12rem * var(--poem-scale));
      font-style: italic;
      color: var(--poem-accent);
      letter-spacing: 0.03em;
    }

    .poem-epigraph {
      max-width: 520px;
      margin: 18px auto 0;
      font-size: calc(1.08rem * var(--poem-scale));
      font-style: italic;
      line-height: 1.65;
      color: var(--text-soft);
      opacity: 0.9;
    }

    /* Treść poetycka */
    .poem-body {
      font-size: calc(1.28rem * var(--poem-scale));
      line-height: 1.88;
      color: var(--text-main);
      max-width: 560px;
      margin: 0 auto;
    }

    .poem-body--verse .stanza {
      margin-bottom: 1.45em;
    }

    .poem-body--verse .stanza:last-child {
      margin-bottom: 0;
    }

    .verse-line {
      margin: 0;
      padding-left: 1.1em;
      text-indent: -1.1em;
    }

    .poem-body--prose .prose-para {
      margin: 0 0 1.15em;
      text-indent: 1.5em;
      line-height: 1.92;
      text-align: left;
    }

    .poem-body--prose .prose-para--short {
      text-indent: 0;
      text-align: center;
      margin: 1.1em 0;
      color: var(--gold-bright);
      letter-spacing: 0.08em;
    }

    /* Specjalny układ karty otwierającej rozdział DziEnniK */
    .poem-sheet--gate .poem-body {
      text-align: center;
      font-size: calc(1.65rem * var(--poem-scale));
      font-style: italic;
      line-height: 1.65;
      margin: 14px auto 26px;
    }
    .poem-sheet--gate .verse-line {
      padding-left: 0;
      text-indent: 0;
    }

    /* Specjalny układ Progu Księgi (Strona tytułowa) */
    .threshold-view {
      text-align: center;
    }

    .threshold-author {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-soft);
      margin-bottom: 12px;
    }

    .threshold-main-title {
      margin: 0;
      font-size: clamp(2.5rem, 5.5vw, 3.8rem);
      font-weight: 400;
      line-height: 1.08;
      color: var(--text-main);
    }

    .threshold-main-title em {
      display: block;
      font-style: italic;
      color: var(--gold-bright);
      margin-top: 4px;
    }

    .threshold-genre {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 18px 0 26px;
    }

    .threshold-cycle {
      font-size: 1.35rem;
      font-style: italic;
      color: var(--gold-bright);
      margin: 0 0 6px;
    }

    .threshold-edition {
      font-family: var(--font-sans);
      font-size: 0.76rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      margin: 0 0 26px;
    }

    .threshold-dedication {
      display: inline-block;
      padding: 10px 28px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-size: 1.3rem;
      font-style: italic;
      color: var(--text-main);
      margin-bottom: 30px;
    }

    .threshold-cta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .primary-enter-btn {
      background: linear-gradient(135deg, rgba(198, 169, 106, 0.24), rgba(198, 169, 106, 0.1));
      border: 1px solid var(--gold);
      color: var(--gold-bright);
      font-family: var(--font-serif);
      font-size: 1.14rem;
      letter-spacing: 0.04em;
      padding: 11px 26px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .primary-enter-btn:hover {
      background: linear-gradient(135deg, rgba(198, 169, 106, 0.34), rgba(198, 169, 106, 0.18));
      box-shadow: 0 0 28px rgba(198, 169, 106, 0.2);
      transform: translateY(-1px);
    }

    .secondary-enter-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--gold-dim);
      color: var(--text-soft);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      padding: 11px 18px;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .secondary-enter-btn:hover {
      border-color: var(--gold);
      color: var(--gold-bright);
    }

    .threshold-chapters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      text-align: left;
      margin-top: 10px;
    }

    .chapter-card {
      background: rgba(255, 255, 255, 0.022);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 15px;
      cursor: pointer;
      transition: border-color 0.25s ease, background 0.25s ease, transform 0.25s ease;
    }

    .chapter-card:hover {
      border-color: var(--gold-dim);
      background: rgba(198, 169, 106, 0.06);
      transform: translateY(-2px);
    }

    .chapter-card__num {
      font-family: var(--font-sans);
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      display: block;
      margin-bottom: 4px;
    }

    .chapter-card__name {
      font-size: 1.12rem;
      color: var(--text-main);
      display: block;
      margin-bottom: 4px;
    }

    .chapter-card__desc {
      font-family: var(--font-sans);
      font-size: 0.73rem;
      color: var(--text-muted);
      line-height: 1.45;
      display: block;
    }

    /* Sygnet stopki strony A5 */
    .sheet-colophon {
      margin-top: 38px;
      padding-top: 18px;
      text-align: center;
      color: var(--text-muted);
    }

    .sheet-colophon__fleuron {
      display: block;
      color: var(--poem-accent);
      font-size: 0.9rem;
      letter-spacing: 0.25em;
      opacity: 0.78;
      margin-bottom: 4px;
    }

    .sheet-colophon__page {
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* Nawigacja „strona po stronie” */
    .page-turners {
      width: min(760px, 100%);
      margin: 20px auto 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .turn-btn {
      background: rgba(20, 18, 14, 0.65);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 18px;
      color: var(--text-main);
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: border-color 0.25s ease, background 0.25s ease, transform 0.2s ease;
    }

    .turn-btn--next {
      text-align: right;
      align-items: flex-end;
    }

    .turn-btn:hover:not(:disabled) {
      border-color: var(--gold-dim);
      background: rgba(198, 169, 106, 0.08);
      transform: translateY(-1px);
    }

    .turn-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .turn-btn__dir {
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .turn-btn__title {
      font-family: var(--font-serif);
      font-size: 1.06rem;
      color: var(--gold-bright);
    }

    .keyboard-hint {
      text-align: center;
      margin-top: 16px;
      font-family: var(--font-sans);
      font-size: 0.69rem;
      color: var(--text-muted);
      opacity: 0.65;
      letter-spacing: 0.04em;
    }

    /* ================= MODAL OKŁADKI WYDANIA ================= */
    .cover-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(6, 5, 4, 0.86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .cover-modal.open {
      display: flex;
    }

    .cover-modal__dialog {
      position: relative;
      max-width: 440px;
      width: 100%;
      background: #14120e;
      border: 1px solid var(--gold-dim);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.85);
    }

    .cover-modal__close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--line);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
    }

    .cover-modal__img {
      width: 100%;
      max-height: 68vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    }

    .cover-modal__caption {
      margin: 14px 0 12px;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--text-soft);
    }

    /* Backdrop szuflady mobilnej */
    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 25;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(3px);
    }

    /* ================= RESPONSYWNOŚĆ ================= */
    @media (max-width: 940px) {
      .sanctuary-layout {
        grid-template-columns: 1fr;
      }
      .sanctuary-index {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: min(320px, 86vw);
        transform: translateX(-100%);
      }
      body.drawer-open .sanctuary-index {
        transform: translateX(0);
        opacity: 1;
        pointer-events: auto;
      }
      body.drawer-open .drawer-backdrop {
        display: block;
      }
      .mobile-menu-btn {
        display: inline-flex;
      }
      .desktop-focus-btn {
        display: none;
      }
      .mobile-close-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .stage-crumb {
        display: none;
      }
      .threshold-chapters {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .page-turners {
        grid-template-columns: 1fr;
      }
      .turn-btn--next {
        text-align: left;
        align-items: flex-start;
      }
      .poem-body {
        font-size: calc(1.16rem * var(--poem-scale));
      }
    }
  </style>
</head>

n    </svg>"}, {"id": "prolog-przedswit", "chapter": "krag-1", "chapterLabel": "I. Niezawiść · Droga przez ogień i światło", "indexTitle": "Prolog: Przedświt", "title": "Prolog: Przedświt", "subtitle": "Podtytuł: „Modlitwa”", "page": "3", "accent": "#d8be82", "glow": "rgba(216, 190, 130, 0.16)", "whisper": "przedświt · krzyż · światło w chaosie", "epigraph": "Tomik wyrasta z wewnętrznych zmagań i potrzeby przemiany. Jest próbą odnalezienia głosu wśród chaosu.", "mode": "prose", "blocks": [["Chrystus tego dnia przyszedł, aby obłaskawić swoje dziecko i powtórzyć dzieło zmartwychwstania dla każdego, co uwierzy. Jego nieskończona moc objawia się przez życie, którego każdy doświadczył na mocy krzyża."], ["........., czy wyznajesz przed Bogiem, że za sprawą Ducha Świętego otrzymujesz światło i przyjmujesz błogosławieństwo w imię Twojego Pana Jezusa Chrystusa, naszego Zbawiciela?"], ["Czy wierzysz w męczeńską śmierć Pana Jezusa na krzyżu?"], ["Czy wierzysz, że Chrystus umarł za nas, a następnie pokonał śmierć i zmartwychwstał?"], ["Czy wierzysz, że Chrystus jest Mesjaszem?"], ["Błogosławię Cię w imię Ojca i Syna i Ducha Świętego. Amen."], ["..."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-prolog\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-prolog)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\">\n            <path d=\"M70 168 Q155 156 220 164 T370 166\" stroke-width=\"0.9\" opacity=\"0.35\"/>\n            <path d=\"M92 178 Q185 168 255 175 T352 176\" stroke-width=\"0.8\" opacity=\"0.25\"/>\n            <g opacity=\"0.28\" stroke-width=\"0.8\" class=\"svg-breathe\">\n                <line x1=\"220\" y1=\"74\" x2=\"148\" y2=\"30\"/>\n                <line x1=\"220\" y1=\"74\" x2=\"178\" y2=\"20\"/>\n                <line x1=\"220\" y1=\"74\" x2=\"262\" y2=\"20\"/>\n                <line x1=\"220\" y1=\"74\" x2=\"292\" y2=\"30\"/>\n                <line x1=\"220\" y1=\"74\" x2=\"124\" y2=\"62\"/>\n                <line x1=\"220\" y1=\"74\" x2=\"316\" y2=\"62\"/>\n            </g>\n            <circle cx=\"220\" cy=\"74\" r=\"26\" stroke-width=\"0.85\" stroke-dasharray=\"2 4\" opacity=\"0.5\"/>\n            <line x1=\"220\" y1=\"34\" x2=\"220\" y2=\"162\" stroke-width=\"1.5\" opacity=\"0.9\"/>\n            <line x1=\"186\" y1=\"74\" x2=\"254\" y2=\"74\" stroke-width=\"1.5\" opacity=\"0.9\"/>\n            <circle cx=\"220\" cy=\"74\" r=\"3\" fill=\"currentColor\" opacity=\"0.85\"/>\n        </g>\n    </svg>"}, {"id": "czesc-i-niezawisc", "chapter": "krag-1", "chapterLabel": "I. Niezawiść · Droga przez ogień i światło", "indexTitle": "Część I: Niezawiść", "title": "Część I: Niezawiść", "subtitle": "Podtytuł: „Ogień bez płomienia”", "page": "4–5", "accent": "#d97b43", "glow": "rgba(217, 123, 67, 0.16)", "whisper": "żar pod kamieniem · słońce w szkle · tafla jeziora", "epigraph": "W ogniu i chłodzie tej części pobrzmiewa rozpad, ale też cicha zapowiedź ładu.", "mode": "prose", "blocks": [["Z otępienia wychodzące spojrzenie, rzucone o ściany płonące w oddali, ale tuż u stóp, obrazu wrzenie."], ["Ognisty informacji słup, z myśli nieosiągalny przez chłodno żarzące się kamienie, które w umyśle jak zima, były jak lód, który chłodził, jeszcze ogrzany asfalt przedwcześnie wylany, by nie poparzył stóp, gdy się na niego wejdzie."], ["Obok mnie tylko słońce w szkle jeszcze letnie, gasi płomienie, póki oddech ognisty zabiorę i ze mną odejdzie tchnienie, dopóki, dopóty umrę, będzie moim przeznaczeniem."], ["Drogą przed nami, wysoką trawą, zapieczętowanymi listami i niewzruszoną dotąd taflą jeziora, być może, z życia odartą, lecz do życia stworzoną. Szklanką pustą do połowy."], ["Nic tu po formie, lecz wszystko po roli. Co ujednolica Niezawiść – to część życia, samotnych wędrowców, aniżeli zwycięzców, w pieśniach tak dziwnych, że trzeba byłoby wysłuchać ognia melodii, by nie popalić ducha i nie popaść w marazm."], ["To odzwierciedlenie bohatera albo niepłodnej bohaterki, osieroconej przez dystans ku nadziei. Początek złożoności chemii, zanim źródłem wypełni się na wieki. To jeszcze nie koniec, chociaż bywają przecieki, to są szklanki czekające wypełnienia krawędzi. Szkło sędzi niezawiści."], ["Ja, Ty, My, Wy, Oni i tylko jeden niezawistny wybór, łączący ich wszystkich, nikomu na przekór, daję się odczuć, niosąc depresji tytuł. W zestawieniu nielegalna, płynąca z ograniczeń iluzja prędkości, prominentna i nierozerwalna wiązka etapu rozwoju społeczeństwa, terapeutyczna zniewaga siły człowieka, równoznaczna z ujednoliceniem grup i jednostek, a to tylko jedno znane mi narzędzie, ale ponad wszystko – tylko przedrostek."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-cz1\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-cz1)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <line x1=\"56\" y1=\"158\" x2=\"384\" y2=\"158\" stroke-width=\"0.9\" opacity=\"0.45\"/>\n            <path d=\"M88 170 H352\" stroke-width=\"0.7\" opacity=\"0.25\"/>\n            <path d=\"M192 52 L198 152 H242 L248 52 Z\" stroke-width=\"1.3\" opacity=\"0.85\"/>\n            <path d=\"M195 104 Q220 101 245 104 L242 152 H198 Z\" fill=\"currentColor\" fill-opacity=\"0.12\" stroke=\"none\"/>\n            <line x1=\"195\" y1=\"104\" x2=\"245\" y2=\"104\" stroke-width=\"1\" opacity=\"0.7\"/>\n            <circle cx=\"220\" cy=\"82\" r=\"11\" stroke-width=\"1.1\" fill=\"currentColor\" fill-opacity=\"0.18\" class=\"svg-breathe\"/>\n            <!-- Żarzące się chłodno kamienie -->\n            <polygon points=\"128,158 140,144 156,148 162,158\" stroke-width=\"1\" fill=\"currentColor\" fill-opacity=\"0.14\"/>\n            <polygon points=\"282,158 292,146 308,149 314,158\" stroke-width=\"1\" fill=\"currentColor\" fill-opacity=\"0.14\"/>\n            <!-- Zapieczętowany list w trawie -->\n            <rect x=\"272\" y=\"116\" width=\"32\" height=\"21\" rx=\"1.5\" transform=\"rotate(-8 288 126)\" stroke-width=\"0.9\" opacity=\"0.65\"/>\n            <path d=\"M272 118 L288 128 L303 114\" stroke-width=\"0.8\" opacity=\"0.55\"/>\n            <circle cx=\"288\" cy=\"127\" r=\"2\" fill=\"currentColor\" opacity=\"0.7\"/>\n        </g>\n    </svg>"}, {"id": "czesc-ii-niezawisc-ii", "chapter": "krag-1", "chapterLabel": "I. Niezawiść · Droga przez ogień i światło", "indexTitle": "Część II: Skąd się bierze siła?", "title": "Część II: Niezawiść II – Skąd się bierze siła?", "subtitle": "Podtytuł: „Chemia ducha”", "page": "6–7", "accent": "#7aa8c7", "glow": "rgba(122, 168, 199, 0.16)", "whisper": "ogień i woda · wulkan Grenlandii · chemia ducha", "epigraph": "Ból staje się początkiem siły. Ogień i woda wyznaczają drogę ku przemianie.", "mode": "verse", "blocks": [["Zasolone bólem powieki", "Zmęczone ciężarem apolepsji", "Nienadaremnie spięte pęki", "Niosące radość ku nadziei", "Prosty ruch okrężny ręki", "To jeszcze nie wiatr z kniei", "Nawet nieszumiące wstęgi", "Porównując, któraś część madeji", "Przedmiot twardy lub czy giętki", "Dla uwiązania tej czy drugiej ręki", "Pasy apolepsji,", "Sprawiedliwość Twojej męki", "Lecz to tylko tytuł, aniżeli,", "Przedmiot, pochodzi jednak z pasji", "Jak gorąca woda, pali,", "Lecz nie płonie w swojej racji", "Zbyt gorące chłodzi, zimne opali", "Wulkan Grenlandii", "Co go ludzie zakazali", "Kapryśny amator piromanii", "I zapomnieli", "Bogactwo żarzących się kamieni", "Wyszukali", "Przez niezawiść skołatani"], ["Jej wiatrem z oddali", "Przez niego pojmani", "Sami się oszukali", "Zbłądzeni."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-cz2\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-cz2)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <circle cx=\"220\" cy=\"96\" r=\"64\" stroke-width=\"0.8\" stroke-dasharray=\"3 5\" opacity=\"0.4\" class=\"svg-breathe\"/>\n            <circle cx=\"220\" cy=\"96\" r=\"46\" stroke-width=\"0.9\" opacity=\"0.35\"/>\n            <!-- Stożek wulkanu w lodzie -->\n            <path d=\"M118 164 L194 84 L208 88 L220 82 L232 88 L246 84 L322 164\" stroke-width=\"1.3\" opacity=\"0.85\"/>\n            <path d=\"M158 164 L202 114 L220 124 L238 114 L282 164\" stroke-width=\"0.8\" opacity=\"0.4\"/>\n            <!-- Para i żar z krateru -->\n            <path d=\"M220 80 C212 62, 228 50, 220 30\" stroke-width=\"1.2\" opacity=\"0.8\" class=\"svg-float\"/>\n            <path d=\"M208 82 C196 64, 204 48, 196 36\" stroke-width=\"0.9\" opacity=\"0.55\" class=\"svg-float\"/>\n            <path d=\"M232 82 C244 64, 236 48, 244 36\" stroke-width=\"0.9\" opacity=\"0.55\" class=\"svg-float\"/>\n            <line x1=\"84\" y1=\"164\" x2=\"356\" y2=\"164\" stroke-width=\"0.9\" opacity=\"0.45\"/>\n            <circle cx=\"220\" cy=\"118\" r=\"4\" fill=\"currentColor\" opacity=\"0.55\" class=\"svg-twinkle\"/>\n        </g>\n    </svg>"}, {"id": "czesc-iii-nowina", "chapter": "krag-1", "chapterLabel": "I. Niezawiść · Droga przez ogień i światło", "indexTitle": "Część III: Nowina", "title": "Część III: Nowina", "subtitle": "Podtytuł: „Światło wracające do serca”", "page": "8–9", "accent": "#d9a7c7", "glow": "rgba(217, 167, 199, 0.16)", "whisper": "motyle · ruczaj wspomnień · zwierciadło prawdy", "epigraph": "Po burzy przychodzi światło: obecność, współczucie i cierpliwy pokój.", "mode": "prose", "blocks": [["Z uścisku uwolniłam się, piękny sen radosny spełnił się mój dzień, Choć momenty żyją w nas, których ogień dawno zgasł."], ["Chwile jak motyle dawno zapomnianym powietrzem zmagane, wzlatują dla mnie, rannej rankiem, wieczorem zaradnej."], ["Gdyby chociaż raz zdarzyło się – umrzeć niewinnej, poszłabym przed siebie na tle ruczaju wspomnień, gdzie falami spowite potoki."], ["Teraz spragniona oddechu cofam wskazówki, na palcach licząc w dal, by znaleźć źródło Twojego uśmiechu."], ["Na skrajach marzeń dowiadywać się, jak mało przy Tobie znaczą i niczyje te łzy nadane przez świat."], ["W toni duszy złaknionej szczerości podpowiada mi serce, to samo co Twoje, przewidujące przyszłość i idące po swoje."], ["Wyobraźnia powleczona strzępkiem kłamstw, tylko w zwierciadle prawdy ukaże swą twarz. Po tym dniu zabiorę ze sobą – na wieczność diamenty – uczucia ludzi czarem dotkniętych."], ["Kto osądzi, czym właściwość, a kto zbłądził, mając w głowie głos rozsądku i miłości..."], ["W biegu chwil nią byłam ja, teraz krwawię z serca na wspomnienie ludzi i ich dawnych ran (ślepych bram)."], ["Na przedwieczu czułam smak i wracam teraz do dziecięcych lat, pozyskałam swą dojrzałość i pamiętam, czym jest radość."], ["Mądrzejsza o skutki podzieliłam dwie połówki,", "raz... dwa... trzy...", "(Ja, nowina)"], ["Na migi rozumiemy się my – w spazmach umysłu ustami dzierżymy falę zmysłów, trochę pochopnie, lecz dźwiękiem zalotnie. Nienazwana rozumu wola w słowach odtajniona kiedyś", "mnie do Ciebie zawoła."], ["Dalekim krokiem wykraczam stęskniona, mając przed sobą i", "Twoje ramiona. Czy zatrzyma się czas oddechem mierzony, bym", "okryła współczuciem śpiewane te strofy? Aż po kres naszych dni,", "zaledwie kilku chwil.", "..."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-cz3\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-cz3)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Zwierciadło / diament w centrum -->\n            <ellipse cx=\"220\" cy=\"96\" rx=\"34\" ry=\"52\" stroke-width=\"1.2\" opacity=\"0.82\"/>\n            <ellipse cx=\"220\" cy=\"96\" rx=\"28\" ry=\"46\" stroke-width=\"0.7\" opacity=\"0.38\"/>\n            <polygon points=\"220,76 232,96 220,116 208,96\" fill=\"currentColor\" fill-opacity=\"0.16\" stroke-width=\"1\"/>\n            <!-- Cofające się wskazówki -->\n            <line x1=\"220\" y1=\"96\" x2=\"206\" y2=\"78\" stroke-width=\"0.9\" opacity=\"0.7\"/>\n            <line x1=\"220\" y1=\"96\" x2=\"235\" y2=\"91\" stroke-width=\"0.9\" opacity=\"0.7\"/>\n            <!-- Dwa motyle -->\n            <g transform=\"translate(138 66) rotate(-18)\" opacity=\"0.8\" class=\"svg-float\">\n                <path d=\"M0 0 C-12 -14, -22 -2, -8 8 C-18 14, -8 22, 0 12 C8 22, 18 14, 8 8 C22 -2, 12 -14, 0 0 Z\" stroke-width=\"1\" fill=\"currentColor\" fill-opacity=\"0.12\"/>\n            </g>\n            <g transform=\"translate(304 58) rotate(16) scale(0.82)\" opacity=\"0.75\" class=\"svg-float\">\n                <path d=\"M0 0 C-12 \" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-epilog)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Łuk wschodzącego słońca -->\n            <path d=\"M142 156 A78 78 0 0 1 298 156\" stroke-width=\"0.9\" stroke-dasharray=\"3 4\" opacity=\"0.45\"/>\n            <line x1=\"76\" y1=\"156\" x2=\"364\" y2=\"156\" stroke-width=\"1\" opacity=\"0.5\"/>\n            <!-- Kielich -->\n            <path d=\"M198 86 Q220 126 242 86 Z\" stroke-width=\"1.3\" fill=\"currentColor\" fill-opacity=\"0.12\"/>\n            <line x1=\"220\" y1=\"108\" x2=\"220\" y2=\"148\" stroke-width=\"1.3\"/>\n            <path d=\"M202 148 H238\" stroke-width=\"1.3\"/>\n            <!-- Strzała ku górze -->\n            <line x1=\"132\" y1=\"62\" x2=\"188\" y2=\"42\" stroke-width=\"1.1\" opacity=\"0.78\"/>\n            <polyline points=\"180,39 189,42 183,50\" stroke-width=\"1.1\" opacity=\"0.78\"/>\n            <!-- Ziarna Słowa opadające w ziemię -->\n            <circle cx=\"278\" cy=\"128\" r=\"1.8\" fill=\"currentColor\" opacity=\"0.7\" class=\"svg-twinkle\"/>\n            <circle cx=\"292\" cy=\"140\" r=\"1.8\" fill=\"currentColor\" opacity=\"0.6\" class=\"svg-twinkle\"/>\n            <circle cx=\"268\" cy=\"145\" r=\"1.6\" fill=\"currentColor\" opacity=\"0.5\"/>\n        </g>\n    </svg>"}, {"id": "milczacym-glosem", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Milczącym Głosem", "title": "Milczącym Głosem", "page": "11", "accent": "#9aa8bd", "glow": "rgba(154, 168, 189, 0.15)", "whisper": "częstotliwość ciszy · zgasłe światło · pamięć oczu", "mode": "verse", "blocks": [["Rozbrzmiewa.", "Częstotliwość ciszy", "Gdy moja dusza milczy,", "Świat wokół krzyczy,", "A ja w pełni goryczy,", "A Ty nie wiesz, z czym się liczyć.", "Kiedyś z krwi, dziś suche moje łzy.", "Światło, które zgasło w mroku", "Nie daje mi zasnąć,", "Pochłonęły go oczy,", "Które w głowie jak dźwięk,", "Pamięc ę po powietrzu,", "Opadniemy lekko,", "A łzy spłyną po sercu,", "Gasząc to, co płonęło w cieniu,"], ["Dom, bzy i Ty."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-proces\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-proces)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Zarys cichego domu -->\n            <path d=\"M188 156 V118 L220 92 L252 118 V156\" stroke-width=\"1.2\" opacity=\"0.8\"/>\n            <rect x=\"213\" y=\"128\" width=\"14\" height=\"28\" stroke-width=\"0.9\" opacity=\"0.55\"/>\n            <line x1=\"150\" y1=\"156\" x2=\"298\" y2=\"156\" stroke-width=\"0.9\" opacity=\"0.4\"/>\n            <!-- Gałązka bzu po prawej -->\n            <path d=\"M276 154 C282 132, 296 112, 312 96\" stroke-width=\"1\" opacity=\"0.75\"/>\n            <circle cx=\"308\" cy=\"96\" r=\"4\" fill=\"currentColor\" fill-opacity=\"0.2\"/>\n            <circle cx=\"316\" cy=\"92\" r=\"3.5\" fill=\"currentColor\" fill-opacity=\"0.2\"/>\n            <circle cx=\"315\" cy=\"101\" r=\"3.5\" fill=\"currentColor\" fill-opacity=\"0.2\"/>\n            <circle cx=\"302\" cy=\"103\" r=\"3.5\" fill=\"currentColor\" fill-opacity=\"0.2\"/>\n            <!-- Snujące się liście i łza -->\n            <path d=\"M126 62 Q138 56 144 68 Q132 74 126 62 Z\" stroke-width=\"1\" opacity=\"0.7\" class=\"svg-float\"/>\n            <path d=\"M156 96 Q168 90 172 102 Q160 108 156 96 Z\" stroke-width=\"0.9\" opacity=\"0.55\" class=\"svg-float\"/>\n            <path d=\"M220 42 C225 52, 226 58, 220 62 C214 58, 215 52, 220 42 Z\" fill=\"currentColor\" fill-opacity=\"0.25\" stroke-width=\"1\"/>\n        </g>\n    </svg>"}, {"id": "dziecie-czasu", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Dziecię czasu", "title": "Dziecię czasu", "page": "13", "accent": "#8da9c4", "glow": "rgba(141, 169, 196, 0.15)", "whisper": "siwe obłoki · klatki filmu · przenikanie czasu", "mode": "prose", "blocks": [["Mijają mnie jak obłoki chmur gęstych od zimna, siwych od toksyn, mijają, wyprzedzają jak wspomnienia filmu, który znam, ale nie pamiętam jego zakończenia. Obawiam się, że też je znam, bo niby jest, OK! Ale przez czas, który mnie mija – ja przenikam."], ["Czy jest to, co będzie – bo było już to, co jest?"], ["Czy zapomnę o tym i przyszłość mnie mijając zabierze tam, gdzie kończy się ta gra, bez zła?"]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-dziecie\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-dziecie)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Taśma wspomnień filmu -->\n            <path d=\"M88 128 C148 118, 210 92, 338 64\" stroke-width=\"1.1\" opacity=\"0.75\"/>\n            <path d=\"M96 152 C156 142, 218 116, 346 88\" stroke-width=\"1.1\" opacity=\"0.75\"/>\n            <line x1=\"128\" y1=\"122\" x2=\"135\" y2=\"145\" stroke-width=\"0.9\" opacity=\"0.5\"/>\n            <line x1=\"176\" y1=\"111\" x2=\"183\" y2=\"134\" stroke-width=\"0.9\" opacity=\"0.5\"/>\n            <line x1=\"226\" y1=\"98\" x2=\"233\" y2=\"121\" stroke-width=\"0.9\" opacity=\"0.5\"/>\n            <line  "Iluminacje", "page": "17", "accent": "#b85d5d", "glow": "rgba(184, 93, 93, 0.15)", "whisper": "rozmyty horyzont · ukryty sens obrazu · sprzeczności istnienia", "mode": "verse", "blocks": [["Zastanawiałem się kiedyś,", "jak działa obraz i sens w nim ukryty.", "Przede mną widniał tylko horyzont rozmyty,", "a ja trwałem w agonii, z uwagi na „żebyś”.", "Resident Evil i zrozumiałem prawdę,", "o życiu i śmierci w powabnym kształcie.", "Sprzeczności zawarte przedstawione z fartem były faktem istnienia", "naprawdę.", "Nauka – nie sługa, nie wszystko przetrwać może i Zombie Ci w", "tym nie pomoże.", "..."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-iluminacje\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-iluminacje)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\">\n            <line x1=\"64\" y1=\"118\" x2=\"376\" y2=\"118\" stroke-width=\"1\" stroke-dasharray=\"6 4\" opacity=\"0.55\"/>\n            <circle cx=\"220\" cy=\"92\" r=\"32\" stroke-width=\"1.3\" opacity=\"0.85\"/>\n            <circle cx=\"230\" cy=\"88\" r=\"27\" fill=\"#0d0b0a\" stroke-width=\"0.8\" opacity=\"0.9\"/>\n            <!-- Odbicie pod horyzontem -->\n            <path d=\"M188 134 A32 18 0 0 0 252 134\" stroke-width=\"0.9\" opacity=\"0.45\"/>\n            <path d=\"M198 148 A22 10 0 0 0 242 148\" stroke-width=\"0.8\" opacity=\"0.3\"/>\n            <rect x=\"158\" y=\"44\" width=\"124\" height=\"144\" stroke-width=\"0.7\" opacity=\"0.25\"/>\n        </g>\n    </svg>"}, {"id": "pies", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Pies", "title": "Pies", "page": "18", "accent": "#b88c62", "glow": "rgba(184, 140, 98, 0.15)", "whisper": "instynkt i lęk · wierność · czas, który minie", "mode": "verse", "blocks": [["Gdy pies podwija ogon", "i zębów widać liczbę mnogą", "instynkt rządzi jego głową,", "w strachu silnym jak samogon.", "Ten czas minie, mój kudłaty,", "gdy Pan ujrzy swoje straty."], ["..."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-pies\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-pies)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <line x1=\"88\" y1=\"156\" x2=\"352\" y2=\"156\" stroke-width=\"0.9\" opacity=\"0.45\"/>\n            <!-- Sylwetka skulonego psa patrzącego w stronę światła -->\n            <path d=\"M178 156 L184 128 L196 112 L212 108 L220 96 L226 104 L238 106 L234 116 L222 120 L226 156\" stroke-width=\"1.25\" fill=\"currentColor\" fill-opacity=\"0.13\"/>\n            <path d=\"M178 138 Q164 146 170 154\" stroke-width=\"1.1\" opacity=\"0.75\"/>\n            <!-- Ciepły promień z góry -->\n            <line x1=\"298\" y1=\"48\" x2=\"236\" y2=\"100\" stroke-width=\"0.9\" stroke-dasharray=\"3 4\" opacity=\"0.55\"/>\n            <circle cx=\"304\" cy=\"42\" r=\"8\" fill=\"currentColor\" fill-opacity=\"0.2\" stroke-width=\"1\" class=\"svg-breathe\"/>\n        </g>\n    </svg>"}, {"id": "white-roses", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "White Roses", "title": "White Roses", "page": "19", "accent": "#e2d5c4", "glow": "rgba(226, 213, 196, 0.15)", "whisper": "motyl i osa · białe róże · żar pieca", "mode": "verse", "blocks": [["Zawisł motyl na łodydze,", "za nim osa pręcik liże,", "oba chwieją się na wietrze,", "On wygląda, Ona bierze.", "Oscylują z wrażliwością,", "cieszą oko, karmią słodko,", "naiwności nadszedł kres,", "Białe Róże wchłonie piec."], ["..."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-whiteroses\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-whiteroses)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Płomienne łuki pieca u podstawy -->\n            <path d=\"M164 174 Q192 152 220 174 Q248 152 276 174\" stroke-width=\"1\" opacity=\"0.5\"/>\n            <!-- Łodyga i kielich białej róży -->\n            <path d=\"M220 170 C216 140, 226 116, 220 92\" stroke-width=\"1.3\"/>\n            <path d=\"M220 92 C202 88, 198 66, 220 56 C242 66, 238 88, 220 92 Z\" fill=\"currentColor\" fill-opacity=\"0.16\" stroke-width=\"1.2\"/>\n            <path d=\"M208 72 Q220 82 232 72\" stroke-width=\"0.9\" opacity=\"0.7\"/>\n            <!-- Motyl po lewej, osa po prawej -->\n            <path d=\"M178 66 C168 56, 162 68, 174 74 C164 80, 172 86, 178 76 Z\" stroke-width=\"0.95\" opacity=\"0.8\" class=\"svg-float\"/>\n            <path d=\"M255 71 L260 69\" stroke-width=\"0.9\" opacity=\"0.75\"/>\n            <ellipse cx=\"264\" cy=\"68\" rx=\"6\" ry=\"3\" transform=\"rotate(-15 264 68)\" stroke-width=\"1\" opacity=\"0.8\"/>\n            <path d=\"M261 65 Q264 56 270 60\" stroke-width=\"0.8\" opacity=\"0.65\"/>\n        </g>\n    </svg>"}, {"id": "maniery", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Maniery", "title": "Maniery", "page": "20", "accent": "#c29263", "glow": "rgba(194, 146, 99, 0.15)", "whisper": "umiar · rozlana kawa · papieros na pół", "mode": "verse", "blocks": [["Wy, co nie macie umiaru,", "A pękacie ze słodyczy nadmiaru.", "Wy, którym powieki zasłaniają życie,", "Tak kończycie – gorzko przełykając!", "Wy, którzy nauczeni patrzeć przed siebie,", "A wcale przez siebie, pożałowania godni.", "Nauka wam przeszkadza oraz", "Zwyczaje dobrego zachowania,", "Zostaniecie w mogile i staniecie się", "Wilkiem, pożerającym własne dzieci."], ["I jesteśmy tu,", "mam, co miłe, a jedzeniem się podzielę,", "co moje, możesz zabrać i kawę nam też rozleję.", "Tylko jedna sprawa, konsekwentna postawa,", "papierosami ja dzielę.", "Nie żebym nie dbał o ciebie,", "lecz wolę zadbać o siebie,", "chociaż na pół bym zapalił.", "..."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-maniery\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-maniery)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <line x1=\"92\" y1=\"154\" x2=\"348\" y2=\"154\" stroke-width=\"0.9\" opacity=\"0.45\"/>\n            <!-- Dwie filiżanki -->\n            <path d=\"M138 124 H172 V142 A14 12 0 0 1 138 142 Z\" stroke-width=\"1.15\" fill=\"currentColor\" fill-opacity=\"0.1\"/>\n            <path d=\"M172 128 H178 A5 5 0 0 1 178 138 H172\" stroke-width=\"1\"/>\n            <path d=\"M268 124 H302 V142 A14 12 0 0 1 268 142 Z\" stroke-width=\"1.15\" fill=\"currentColor\" fill-opacity=\"0.1\"/>\n            <path d=\"M302 128 H308 A5 5 0 0 1 308 138 H302\" stroke-width=\"1\"/>\n            <!-- Papieros pośrodku z podziałem na pół -->\n            <rect x=\"196\" y=\"138\" width=\"48\" height=\"6\" rx=\"1.5\" stroke-width=\"1\"/>\n            <line x1=\"220\" y1=\"134\" x2=\"220\" y2=\"148\" stroke-width=\"0.9\" stroke-dasharray=\"2 2\" opacity=\"0.75\"/>\n            <!-- Smuga dymu -->\n            <path d=\"M244 136 C250 116, 234 100, 244 76 C250 62, 238 50, 242 38\" stroke-width=\"0.95\" opacity=\"0.65\" class=\"svg-float\"/>\n        </g>\n    </svg>"}, {"id": "do-mediow", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Do mediów", "title": "Do mediów", "page": "21", "accent": "#8fa0b5", "glow": "rgba(143, 160, 181, 0.15)", "whisper": "dawna antena · muzyka z serca · przebudzenie", "mode": "prose", "blocks": [["Życzyłbym sobie, jeśli tak wyrazić się mogę, powrotu dawnych lat, gdy słuszne idee były wzniośle prezentowane na antenie. Bez sztucznych balonów i niewyszukanego słowa, gdzie liczyła się prezencja, maniery i wymowa, a muzyka była z serca, dla serca."], ["Tak wschodziły gwiazdy."], ["Dzisiaj z dzieci robi się reklamy i zamyka im drogę do sławy, sprzedając wizerunki ludzi, chyba po to, by sprowokować,"], ["innych,"], ["by nie obudzić."], ["Tyle o XXI wieku sławach i niech dalej trwa zabawa."], ["..."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-domediow\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-domediow)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Wieża antenowa -->\n            <path d=\"M196 168 L220 62 L244 168\" stroke-width=\"1.2\" opacity=\"0.85\"/>\n            <line x1=\"205\" y1=\"128\" x2=\"235\" y2=\"128\" stroke-width=\"0.9\" opacity=\"0.55\"/>\n            <line x1=\"211\" y1=\"98\" x2=\"229\" y2=\"98\" stroke-width=\"0.9\" opacity=\"0.55\"/>\n            <circle cx=\"220\" cy=\"58\" r=\"3\" fill=\"currentColor\"/>\n            <!-- Fale z serca anteny -->\n            <path d=\"M198 46 A28 28 0 0 0 198 70\" stroke-width=\"0.9\" opacity=\"0.6\" class=\"svg-breathe\"/>\n            <path d=\"M242 46 A28 28 0 0 1 242 70\" stroke-width=\"0.9\" opacity=\"0.6\" class=\"svg-breathe\"/>\n            <path d=\"M184 36 A44 44 0 0 0 184 80\" stroke-width=\"0.8\" opacity=\"0.35\"/>\n            <path d=\"M256 36 A44 44 0 0 1 256 80\" stroke-width=\"0.8\" opacity=\"0.35\"/>\n            <!-- Gwiazdy -->\n            <circle cx=\"132\" cy=\"48\" r=\"1.8\" fill=\"currentColor\" opacity=\"0.8\" class=\"svg-twinkle\"/>\n            <circle cx=\"312\" cy=\"44\" r=\"1.8\" fill=\"currentColor\" opacity=\"0.8\" class=\"svg-twinkle\"/>\n            <!-- Pusty balon w oddali -->\n            <ellipse cx=\"328\" cy=\"112\" rx=\"10\" ry=\"13\" stroke-width=\"0.8\" stroke-dasharray=\"2 2\" opacity=\"0.4\"/>\n            <path d=\"M328 125 Q324 138 330 148\" stroke-width=\"0.7\" opacity=\"0.35\"/>\n        </g>\n    </svg>"}, {"id": "nad-brzegiem-czern", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Nad brzegiem... Czerń", "title": "Nad brzegiem... Czerń", "page": "22", "accent": "#7694ad", "glow": "rgba(118, 148, 173, 0.16)", "whisper": "brzeg morza · kasztanowa kora · Alfa i Omega", "mode": "verse", "blocks": [["Nad brzegiem morza, gdzie stóp odciśnięte wzory", "Krzyczę jak dziecię i wzywam do nieba,", "Stoję – pragnę wysłuchać fali westchnienia", "Aby zwodować statele z kasztanowej kory"], ["„Jam jest Alfa i Omega!” – po wszystkim to tyle,", "co mi wiedzieć trzeba."], ["W tej sile przywołuję ostatnią chwilę,", "Przez ich wzgląd na ilość nie zastanawiam się", "Tyle,", "Raczej patrzę pod nogi – i idę.", "..."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-nadbrzegiem\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-nadbrzegiem)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <path d=\"M62 128 Q142 118 220 128 T378 126\" stroke-width=\"1.1\" opacity=\"0.7\"/>\n            <path d=\"M84 146 Q162 138 240 146 T356 144\" stroke-width=\"0.8\" opacity=\"0.38\"/>\n            <!-- Stateczek z kory -->\n            <path d=\"M192 118 L248 118 L236 130 H204 Z\" fill=\"currentColor\" fill-opacity=\"0.2\" stroke-width=\"1.2\" class=\"svg-float\"/>\n            <path d=\"M220 118 V86 L238 110 L220 112\" stroke-width=\"1\" opacity=\"0.8\" class=\"svg-float\"/>\n            <!-- Ślady stóp na brzegu -->\n            <ellipse cx=\"118\" cy=\"168\" rx=\"4\" ry=\"2\" transform=\"rotate(-12 118 168)\" fill=\"currentColor\" opacity=\"0.45\"/>\n            <ellipse cx=\"142\" cy=\"164\" rx=\"4\" ry=\"2\" transform=\"rotate(-8 142 164)\" fill=\"currentColor\" opacity=\"0.5\"/>\n            <ellipse cx=\"166\" cy=\"167\" rx=\"4\" ry=\"2\" transform=\"rotate(-10 166 167)\" fill=\"currentColor\" opacity=\"0.55\"/>\n            <!-- Alfa i Omega na niebie -->\n            <text x=\"206\" y=\"54\" fill=\"currentColor\" font-family=\"Georgia, serif\" font-size=\"13\" letter-spacing=\"8\" opacity=\"0.65\">Α Ω</text>\n        </g>\n    </svg>"}, {"id": "poludniowy-oddech", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Południowy oddech...", "title": "Południowy oddech...", "page": "23", "accent": "#c97a63", "glow": "rgba(201, 122, 99, 0.16)", "whisper": "dym i wiatr · zaklejony list · południowy świt", "mode": "verse", "blocks": [["W głowie tylko dym,", "W płucach wielki wstyd,", "Pierwszy wzięli Krym,", "A ja myślę, że się nie ma o co bić..."], ["Oddech cięższy z każdym dniem,", "W atmosferze tańczy śmierć,", "Chce się żyć, choć to droga na krzyż,", "Brak mi słów, zaklejam list."], ["Z oddali słychać gęsty wiatr,", "Za nami szumny krzyk,", "Gaśnie księżyc,", "Nie ma nic."], ["Nie idzie ze mną, a ja z nim,", "Lecę tam, gdzie się niesie dym,", "Po północy zasnę z tym,", "Lecz przede mną jeszcze południowy świt."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-poludniowy\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-poludniowy)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Horyzont świtu -->\n            <line x1=\"68\" y1=\"156\" x2=\"372\" y2=\"156\" stroke-width=\"1\" opacity=\"0.55\"/>\n            <path d=\"M176 156 A44 26 0 0 1 264 156\" fill=\"currentColor\" fill-opacity=\"0.16\" stroke-width=\"0.9\"/>\n            <!-- Gasnący sierp księżyca -->\n            <path d=\"M138 52 A18 18 0 1 0 154 78 A14 14 0 1 1 138 52 Z\" stroke-width=\"1\" opacity=\"0.65\"/>\n            <!-- Smuga dymu i wiatru -->\n            <path d=\"M98 116 C158 98, 224 128, 326 92\" stroke-width=\"0.9\" opacity=\"0.45\" class=\"svg-float\"/>\n            <!-- Zaklejony list -->\n            <rect x=\"278\" y=\"114\" width=\"44\" height=\"28\" rx=\"2\" stroke-width=\"1.1\" opacity=\"0.8\"/>\n            <polyline points=\"278,115 300,131 322,115\" stroke-width=\"1\" opacity=\"0.75\"/>\n        </g>\n    </svg>"}, {"id": "zegar", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Zegar", "title": "Zegar", "page": "24", "accent": "#d9b873", "glow": "rgba(217, 184, 115, 0.17)", "whisper": "dwanaście prerii · tempo wieży · mieszkanie czasu", "mode": "verse", "blocks": [["Wyobraź sobie, że świat to jest zegar", "Dwanaście godzin na nim to inna preria", "Każda swoich dokonuje przemian.", "Dalej, minut sześćdziesiąt jak granic przedpole", "I nowe języki, i te od dawna znane", "Jednoczą armię.", "Sekundy, te są jedyne, jak życie", "I od nich zależy", "Ostatnie tempo wieży.", "Czas to mieszkanie z zegarem na ścianie,", "A kto w nim mieszka – to do Ciebie jest pytanie."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-zegar\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-zegar)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Zarys pokoju / wieży -->\n            <path d=\"M152 174 V64 L220 30 L288 64 V174\" stroke-width=\"0.9\" opacity=\"0.38\"/>\n            <!-- Tarcza zegara (nawiązanie do Hiperzegara) -->\n            <circle cx=\"220\" cy=\"108\" r=\"48\" stroke-width=\"1.3\" opacity=\"0.9\"/>\n            <circle cx=\"220\" cy=\"108\" r=\"34\" stroke-width=\"0.75\" stroke-dasharray=\"2 4\" opacity=\"0.5\"/>\n            <circle cx=\"220\" cy=\"108\" r=\"3\" fill=\"currentColor\"/>\n            <line x1=\"220\" y1=\"108\" x2=\"220\" y2=\"74\" stroke-width=\"1.3\"/>\n            <line x1=\"220\" y1=\"108\" x2=\"246\" y2=\"122\" stroke-width=\"1.2\"/>\n            <!-- 12 znaczników prerii -->\n            <circle cx=\"220\" cy=\"64\" r=\"1.6\" fill=\"currentColor\"/>\n            <circle cx=\"264\" cy=\"108\" r=\"1.6\" fill=\"currentColor\"/>\n            <circle cx=\"220\" cy=\"152\" r=\"1.6\" fill=\"currentColor\"/>\n            <circle cx=\"176\" cy=\"108\" r=\"1.6\" fill=\"currentColor\"/>\n        </g>\n    </svg>"}, {"id": "patrzac-wstecz-na-rozlana-ciecz", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Patrząc wstecz na rozlaną ciecz", "title": "Patrząc wstecz na rozlaną ciecz", "page": "25", "accent": "#d19b66", "glow": "rgba(209, 155, 102, 0.16)", "whisper": "chemia mokrych plam · stare płótno · pędzel pod bieżącą wodą", "mode": "verse", "blocks": [["Oboje w nagość przyodziani,", "bo ze wstydu rozebrani.", "Dobrze nam razem,", "bo wyschło już miejsce, w którym byliśmy sami.", "Cichym płaczem dziecka,", "koloruję dzisiaj świat,", "tej nocy będę snuł", "jutrzejszą barwę dnia,", "a to, co było wczoraj,", "będzie pędzlem dla mych farb.", "Jestem wdzięczny za tę chemię mokrych plam.", "Przewidując przyszłość,", "byłem więźniem dawnych lat.", "Stare płótno już pożółkło,", "bo zaschnął na nim czas,", "a odmalował je na nowo,", "kto ten pędzel umył", "pod bieżącą wodą."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-ciecz\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><elli ć i oddychać", "Obok siebie."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-obok\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-obok)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Planeta Małego Księcia i słońce -->\n            <circle cx=\"176\" cy=\"78\" r=\"18\" stroke-width=\"1.1\" opacity=\"0.8\"/>\n            <circle cx=\"268\" cy=\"64\" r=\"12\" fill=\"currentColor\" fill-opacity=\"0.22\" stroke-width=\"1.1\" class=\"svg-breathe\"/>\n            <!-- Dwie linie oddechu tuż obok siebie -->\n            <path d=\"M96 138 Q158 118 220 138 T344 138\" stroke-width=\"1.2\" opacity=\"0.85\"/>\n            <path d=\"M96 148 Q158 128 220 148 T344 148\" stroke-width=\"1.2\" opacity=\"0.65\"/>\n            <circle cx=\"142\" cy=\"48\" r=\"1.5\" fill=\"currentColor\" opacity=\"0.7\" class=\"svg-twinkle\"/>\n            <circle cx=\"312\" cy=\"96\" r=\"1.5\" fill=\"currentColor\" opacity=\"0.7\" class=\"svg-twinkle\"/>\n        </g>\n    </svg>"}, {"id": "postaci", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Postaci", "title": "Postaci", "page": "28", "accent": "#8f98ab", "glow": "rgba(143, 152, 171, 0.15)", "whisper": "srogi deszcz · Żywioł Ducha · Wasal i Kostucha", "mode": "verse", "blocks": [["Czasem tak srogi", "Deszcz wydaje się ubogi.", "Koncepcja starań", "Niszczycielską siłą władań", "Wśród żywiołów", "Żywioł Ducha", "W połączeniu", "Wasal i Kostucha"]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.o węgle nawet pod powierzchnią", "będą się żarzyć."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-ekspresywnie\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-ekspresywnie)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Tafla i kry lodu -->\n            <polygon points=\"96,108 164,98 198,112 142,120\" stroke-width=\"1.1\" opacity=\"0.75\"/>\n            <polygon points=\"214,106 286,96 344,110 268,120\" stroke-width=\"1.1\" opacity=\"0.75\"/>\n            <!-- Płomień w oku powyżej -->\n            <path d=\"M220 46 C230 62, 232 76, 220 86 C208 76, 210 62, 220 46 Z\" fill=\"currentColor\" fill-opacity=\"0.22\" stroke-width=\"1.1\" class=\"svg-breathe\"/>\n            <!-- Węgle żarzące się pod powierzchnią -->\n            <polygon points=\"184,148 198,138 212,146 204,158 188,156\" fill=\"currentColor\" fill-opacity=\"0.28\" stroke-width=\"1\" class=\"svg-twinkle\"/>\n            <polygon points=\"222,152 238,140 254,148 246,160 228,160\" fill=\"currentColor\" fill-opacity=\"0.28\" stroke-width=\"1\" class=\"svg-twinkle\"/>\n            <polygon points=\"204,164 218,156 230,164 220,172\" fill=\"currentColor\" fill-opacity=\"0.22\" stroke-width=\"0.9\"/>\n        </g>\n    </svg>"}, {"id": "w-kolejnosci", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "W kolejności", "title": "W kolejności", "page": "31", "accent": "#d8ba73", "glow": "rgba(216, 186, 115, 0.16)", "whisper": "klucze pod górę · światło umysłu · podróż w nieznane", "mode": "verse", "blocks": [["Myśli solą wszystkie plany", "Siła bierze swój początek", "Życie pcha pod górę", "Formę straży dobitniej", "Zdobywając klucze", "Stan zmieniają", "w kolejności", "Umysł to jedyna rzecz", "Której nie zasoli", "W nim zawarte", "Światło", "Miga, mruga, błyska", "Z oddali i z bliska", "A droga wyboista", "Zasada pracowitości", "Poszukuję", "i kończę, gdy potrzebuję", "A gdy wstaję", "Kocham życie", "Bo podróżą w nieznane", "Takie poznałem."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-wkolejnosci\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-wkolejnosci)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Górska ścieżka -->\n            <path d=\"M108 170 L166 138 L152 118 L206 92 L198 78 L220 58\" stroke-width=\"1.25\" opacity=\"0.85\"/>\n            <path d=\"M84 170 L182 104 L220 58 L272 116 L348 170\" stroke-width=\"0.85\" opacity=\"0.35\"/>\n            <!-- Światło migające na szczycie -->\n            <circle cx=\"220\" cy=\"52\" r=\"7\" fill=\"currentColor\" fill-opacity=\"0.3\" stroke-width=\"1.2\" class=\"svg-breathe\"/>\n            <line x1=\"220\" y1=\"30\" x2=\"220\" y2=\"39\" stroke-width=\"1\"/>\n            <line x1=\"198\" y1=\"52\" x2=\"207\" y2=\"52\" stroke-width=\"1\"/>\n            <line x1=\"233\" y1=\"52\" x2=\"242\" y2=\"52\" stroke-width=\"1\"/>\n            <!-- Klucz przy ścieżce -->\n            <circle cx=\"286\" cy=\"134\" r=\"6\" stroke-width=\"1\" opacity=\"0.7\"/>\n            <line x1=\"292\" y1=\"134\" x2=\"314\" y2=\"134\" stroke-width=\"1\" opacity=\"0.7\"/>\n            <line x1=\"308\" y1=\"134\" x2=\"308\" y2=\"140\" stroke-width=\"1\" opacity=\"0.7\"/>\n            <line x1=\"313\" y1=\"134\" x2=\"313\" y2=\"141\" stroke-width=\"1\" opacity=\"0.7\"/>\n        </g>\n    </svg>"}, {"id": "plamki", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Plamki", "title": "Plamki", "page": "32", "accent": "#c89f81", "glow": "rgba(200, 159, 129, 0.15)", "whisper": "dwie dłonie · linie czasu · anatomia bliskości", "mode": "verse", "blocks": [["Patrzę na dłonie", "Twoje i moje", "Tak odmiennie inne", "Przez czas naznaczone", "Ekspresja tego stanu", "Stwarza pary anatomię", "Uciekam od niej,", "Bo gdy swoje widzę,", "To się boję", "Może, gdybym wyleczył rany...", "To jednak jestem stary", "I zatroskany"]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-plamki\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-plamki)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Lewa dłoń -->\n            <path d=\"M152 158 V106 A6 6 0 0 1 164 106 V92 A6 6 0 0 1 176 92 V86 A6 6 0 0 1 188 86 V96 A6 6 0 0 1 200 96 V126 L208 114 A5 5 0 0 1 216 120 L198 158 Z\" stroke-width=\"1.15\" opacity=\"0.82\"/>\n            <path d=\"M164 128 Q180 122 192 134\" stroke-width=\"0.8\" opacity=\"0.5\"/>\n            <circle cx=\"174\" cy=\"138\" r=\"1.5\" fill=\"currentColor\" opacity=\"0.65\"/>\n            <circle cx=\"184\" cy=\"118\" r=\"1.3\" fill=\"currentColor\" opacity=\"0.55\"/>\n            <!-- Prawa dłoń -->\n            <path d=\"M288 158 V106 A6 6 0 0 0 276 106 V92 A6 6 0 0 0 264 92 V86 A6 6 0 0 0 252 86 V96 A6 6 0 0 0 240 96 V126 L232 114 A5 5 0 0 0 224 120 L242 158 Z\" stroke-width=\"1.15\" opacity=\"0.82\"/>\n            <path d=\"M276 128 Q260 122 248 134\" stroke-width=\"0.8\" opacity=\"0.5\"/>\n            <circle cx=\"262\" cy=\"136\" r=\"1.5\" fill=\"currentColor\" opacity=\"0.65\"/>\n        </g>\n    </svg>"}, {"id": "oderwana", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Oderwana", "title": "Oderwana", "page": "33", "accent": "#958ec7", "glow": "rgba(149, 142, 199, 0.16)", "whisper": "ukryty obraz · gwiazdy pod stołem · siedem żyć", "mode": "verse", "blocks": [["Gdzie znikł piękny obraz Twój?", "Przecież wiesz, że żaden – nie był mój.", "Dlaczego więc schowałaś go gdzieś pod stół?", "Dobrze wiesz, jak za tym tęsknię,", "czy za karę każesz mi cierpieć?", "Może opatrzyłaś go gwiazdami,", "i myślisz,", "że mnie to rani...", "To najgorsze, co możesz dla mnie zrobić,", "bo przed Tobą nie ma już nic,", "a tym dziełem odbierasz mi siedem żyć."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-oderwana\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-oderwana)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Pusta rama na ścianie -->\n            <rect x=\"190\" y=\"34\" width=\"60\" height=\"44\" stroke-width=\"1\" stroke-dasharray=\"4 3\" opacity=\"0.45\"/>\n            <!-- Stół -->\n            <line x1=\"128\" y1=\"104\" x2=\"312\" y2=\"104\" stroke-width=\"1.3\" opacity=\"0.8\"/>\n            <line x1=\"146\" y1=\"104\" x2=\"146\" y2=\"168\" stroke-width=\"1.1\" opacity=\"0.65\"/>\n            <line x1=\"294\" y1=\"104\" x2=\"294\" y2=\"168\" stroke-width=\"1.1\" opacity=\"0.65\"/>\n            <!-- Ukryty pod stołem obraz z gwiazdami -->\n            <g transform=\"translate(220 142) rotate(-7)\">\n                <rect x=\"-28\" y=\"-20\" width=\"56\" height=\"40\" fill=\"currentColor\" fill-opacity=\"0.13\" stroke-width=\"1.2\"/>\n                <circle cx=\"-10\" cy=\"-6\" r=\"1.8\" fill=\"currentColor\" class=\"svg-twinkle\"/>\n                <circle cx=\"8\" cy=\"-8\" r=\"2.1\" fill=\"currentColor\" class=\"svg-twinkle\"/>\n                <circle cx=\"0\" cy=\"6\" r=\"1.6\" fill=\"currentColor\" class=\"svg-twinkle\"/>\n                <circle cx=\"14\" cy=\"8\" r=\"1.5\" fill=\"currentColor\"/>\n                <circle cx=\"-14\" cy=\"9\" r=\"1.4\" fill=\"currentColor\"/>\n            </g>\n        </g>\n    </svg>"}, {"id": "wolalbym-cierpiec-z-milosci", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Wolałbym cierpieć z Miłości", "title": "Wolałbym cierpieć z Miłości", "page": "34", "accent": "#db9065", "glow": "rgba(219, 144, 101, 0.16)", "whisper": "odsłonięty pył · ulice Szacunku · pragnienie słońca", "mode": "verse", "blocks": [["Wolałbym cierpieć z Miłości.", "Udając radośnie gościa ugościć,", "Milczenie zamienić w niszczycielską siłę.", "Prawdę subtelnie szorstkimi dłońmi", "Odsłonić – zaległy pył.", "Z nieba odtwarzać tę mantrę", "Na nowo budując każdy dzień,", "I znów polegać na sobie,", "Zapomnieć o powodach.", "Niedowierzanie przemierzając ulice", "Szacunku,", "Zapragnąć tam Twojego słońca."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-wolalbym\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-wolalbym)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Perspektywa ulicy -->\n            <line x1=\"92\" y1=\"172\" x2=\"198\" y2=\"96\" stroke-width=\"1.1\" opacity=\"0.7\"/>\n            <line x1=\"348\" y1=\"172\" x2=\"242\" y2=\"96\" stroke-width=\"1.1\" opacity=\"0.7\"/>\n            <line x1=\"136\" y1=\"54\" x2=\"198\" y2=\"96\" stroke-width=\"0.8\" opacity=\"0.32\"/>\n            <line x1=\"304\" y1=\"54\" x2=\"242\" y2=\"96\" stroke-width=\"0.8\" opacity=\"0.32\"/>\n            <!-- Upragnione słońce na końcu ulicy -->\n            <circle cx=\"220\" cy=\"82\" r=\"20\" fill=\"currentColor\" fill-opacity=\"0.22\" stroke-width=\"1.3\" class=\"svg-breathe\"/>\n            <!-- Drobinki odsłoniętego pyłu -->\n            <circle cx=\"174\" cy=\"128\" r=\"1.4\" fill=\"currentColor\" opacity=\"0.55\" class=\"svg-twinkle\"/>\n            <circle cx=\"264\" cy=\"132\" r=\"1.4\" fill=\"currentColor\" opacity=\"0.55\" class=\"svg-twinkle\"/>\n            <circle cx=\"220\" cy=\"144\" r=\"1.5\" fill=\"currentColor\" opacity=\"0.5\"/>\n        </g>\n    </svg>"}, {"id": "wiedza", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Wiedza", "title": "Wiedza", "page": "35", "accent": "#7da6ba", "glow": "rgba(125, 166, 186, 0.16)", "whisper": "skrzydła nad miastem · dwimeryt · supeł pętli pomysłów", "mode": "prose", "blocks": [["Nowa era się zaczęła – nad miastem skrzydła rozpościeram – ironia losu czy raczej przekorny los – w formie zbytu trafiam w cel jak bomba dwimerytu."], ["I czekam, po cichu, rozwiązując zagadki umysłu,"], ["i bez namysłu, supeł pętli pomysłów..."]], "svg": "<svg class=\"poem-svg\" viewBox=\"0 0 440 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\"><defs><radialGradient id=\"g-wiedza\" cx=\"50%\" cy=\"50%\" r=\"52%\"><stop offset=\"0%\" stop-color=\"currentColor\" stop-opacity=\"0.22\"/><stop offset=\"55%\" stop-color=\"currentColor\" stop-opacity=\"0.06\"/><stop offset=\"100%\" stop-color=\"currentColor\" stop-opacity=\"0\"/></radialGradient></defs><ellipse cx=\"220\" cy=\"105\" rx=\"185\" ry=\"92\" fill=\"url(#g-wiedza)\" class=\"svg-breathe\"/>\n        <g stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <!-- Rozpostarte skrzydła -->\n            <path d=\"M220 86 C188 48, 134 42, 88 64 C122 74, 156 86, 198 96\" stroke-width=\"1.25\" fill=\"currentColor\" fill-opacity=\"0.1\" class=\"svg-float\"/>\n            <path d=\"M220 86 C252 48, 306 42, 352 64 C318 74, 284 86, 242 96\" stroke-width=\"1.25\" fill=\"currentColor\" fill-opacity=\"0.1\" class=\"svg-float\"/>\n            <!-- Supeł pętli pomysłów w centrum -->\n            <path d=\"M202 92 C202 78, 238 78, 238 92 C238 106, 202 106, 202 92 Z\" stroke-width=\"1.1\"/>\n            <path d=\"M212 80 C226 80, 226 104, 212 104 C198 104, 228 74, 228 104\" stroke-width=\"0.9\" opacity=\"0.75\"/>\n            <!-- Sylweta miasta u dołu -->\n            <polyline points=\"106,168 106,148 128,148 128,136 152,136 152,154 182,154 182,130 208,130 208,168 234,168 234,138 262,138 262,152 292,152 292,142 318,142 318,168\" stroke-width=\"0.95\" opacity=\"0.55\"/>\n        </g>\n    </svg>"}, {"id": "wiersze-i-poematy", "chapter": "krag-2", "chapterLabel": "II. Artefakty · Wiersze", "indexTitle": "Wiersze i Poematy", "title": "Wiersze i Poematy", "page": "36", "accent": "#8cb386", "glow": "rgba(140, 179, 134, 0.15)", "whisper": "stary i nowy dom · liście i jeże · każda chwila", "mode": "verse", "blocks": [["Wokół domu,", "rosną drzewa, co zrzucają liście z nieba i znikają wśród nich jeże."], ["W starym domu,", "zmawia się pacierze, w nowym dzwony tylko biją, gdy jesteśmy", "pod pierzyną."], ["W każde lat
