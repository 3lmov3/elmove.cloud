<!DOCTYPE html>
<html lang="pl">
<head>
<script src="../elmove-app.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELMOVE.CLOUD – Ruch Uniesienia</title>
  <meta name="description" content="Elation Movement Forum - przestrzeń idei, ruchu i świadomości.">
  <link rel="stylesheet" href="styles.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    .chat-panel {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 320px;
      max-height: 420px;
      background: rgba(20,20,20,0.95);
      border: 1px solid #d4af37;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 0 0 20px rgba(212,175,55,0.3);
    }
    .chat-header {
      background: #222;
      color: #d4af37;
      padding: 8px 12px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 10px 10px 0 0;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      font-size: 13px;
      text-align: left;
      max-height: 280px;
    }
    .chat-msg {
      margin-bottom: 6px;
      padding: 4px 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
    }
    .chat-msg .author { color: #d4af37; font-weight: 600; }
    .chat-msg .time { color: #888; font-size: 11px; margin-left: 6px; }
    .chat-input-row {
      display: flex;
      gap: 4px;
      padding: 8px;
      border-top: 1px solid #333;
    }
    .chat-input-row input {
      flex: 1;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
    }
    .chat-input-row button {
      background: #d4af37;
      color: #111;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .thread-card {
      background: rgba(0,0,0,0.6);
      border: 1px solid #333;
      margin: 12px auto;
      max-width: 700px;
      padding: 16px;
      border-radius: 8px;
      text-align: left;
      position: relative;
    }
    .thread-card h3 { margin: 0 0 8px; color: #d4af37; }
    .thread-meta { color: #aaa; font-size: 13px; margin-bottom: 8px; }
    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(40,0,0,0.85);
      border: 1px solid #c33;
      color: #ff5555;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: none;
      z-index: 20;
      opacity: 1 !important;
    }
    body.admin-mode .delete-btn { display: inline-block !important; }
    .admin-btn {
      background: transparent;
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      margin-left: 8px;
    }
    .admin-btn.active { background: #d4af37; color: #111; }
    #admin-pw-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:99999;
      align-items:center; justify-content:center;
    }
    #admin-pw-overlay.open { display:flex; }
    #admin-pw-box {
      background:#1a1a1a; border:2px solid #d4af37; border-radius:12px; padding:24px;
      max-width:340px; width:90%; color:#eee; font-family:system-ui,sans-serif;
    }
    #admin-pw-box h3 { margin:0 0 12px; color:#d4af37; }
    #admin-pw-box input {
      width:100%; box-sizing:border-box; background:#111; border:1px solid #555;
      color:#fff; padding:10px; border-radius:6px; margin:12px 0; font-size:15px;
    }
    #admin-pw-box .row { display:flex; gap:8px; justify-content:flex-end; }
    #admin-pw-box button { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-weight:600; }
    #admin-pw-ok { background:#d4af37; color:#111; }
    #admin-pw-cancel { background:#333; color:#ccc; }
    .new-thread-form, .reply-form {
      max-width: 700px;
      margin: 16px auto;
      background: rgba(0,0,0,0.7);
      padding: 16px;
      border-radius: 8px;
      text-align: left;
    }
    .new-thread-form input, .new-thread-form textarea,
    .reply-form input, .reply-form textarea {
      width: 100%;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .live-badge {
      display: inline-block;
      background: #0a0;
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    #threads-list { min-height: 200px; }
    .em-symbol {
      width: 48px;
      height: 48px;
      object-fit: contain;
      vertical-align: middle;
      margin-right: 8px;
    }
  </style>
    <!-- Ikona aplikacji / „Dodaj do ekranu głównego” -->
  <link rel="icon" type="image/png" sizes="32x32" href="https://3lmov3.github.io/elmove.cloud/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://3lmov3.github.io/elmove.cloud/images/apple-touch-icon.png">
  <link rel="manifest" href="https://3lmov3.github.io/elmove.cloud/site.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
</head>
<body>
  <header>
    <h1>
      <a href="../index.html" id="home-link">
        <img src="../images/elmovelogo.png" alt="EM" class="em-symbol" onerror="this.style.display='none'">
        ELMOVE.CLOUD
      </a>
      <span class="live-badge">LIVE</span>
    </h1>
  </header>

  <main>
    <div style="margin: 20px auto; max-width: 700px;">
      <button class="btn" id="btn-new-thread">+ Nowy wątek</button>
      <button type="button" class="btn" id="btn-refresh" style="margin-left:8px;">Odśwież</button>
      <button class="admin-btn" id="btn-admin" type="button">Admin</button>
    </div>

    <div id="admin-pw-overlay">
      <div id="admin-pw-box">
        <h3>Hasło admina</h3>
        <p style="margin:0;font-size:13px;color:#aaa;">Wpisz hasło, aby usuwać wątki i odpowiedzi.</p>
        <input type="password" id="admin-pw-input" placeholder="Hasło…" autocomplete="off">
        <div class="row">
          <button type="button" id="admin-pw-cancel">Anuluj</button>
          <button type="button" id="admin-pw-ok">OK</button>
        </div>
      </div>
    </div>

    <div id="new-thread-panel" class="new-thread-form" style="display:none;">
      <h3>Nowy wątek</h3>
      <input type="text" id="nt-author" placeholder="Twój nick">
      <input type="password" id="nt-password" placeholder="Hasło nicku (jeśli zabezpieczony)" style="display:none;">
      <label id="nt-protect-label" style="display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#aaa;font-size:13px;cursor:pointer;">
        <input type="checkbox" id="nt-protect"> Zabezpiecz ten nick hasłem (na stałe)
      </label>
      <input type="password" id="nt-set-password" placeholder="Ustaw hasło do nicku (min. 3 znaki)" style="display:none;">
      <input type="text" id="nt-title" placeholder="Tytuł wątku">
      <textarea id="nt-content" rows="4" placeholder="Treść..."></textarea>
      <button class="btn" id="nt-submit">Opublikuj</button>
      <button class="btn" id="nt-cancel" style="background:#444;">Anuluj</button>
    </div>

    <div id="threads-list"></div>
  </main>

  <!-- Live Chat -->
  <div class="chat-panel" id="chat-panel">
    <div class="chat-header">
      <span>Czat na żywo</span>
      <button id="chat-toggle" style="background:transparent;border:none;color:#d4af37;cursor:pointer;">−</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-author" placeholder="Nick" style="max-width:80px;">
      <input type="text" id="chat-text" placeholder="Wiadomość...">
      <button id="chat-send">➤</button>
    </div>
  </div>

  <script>
    const socket = (typeof io === "function") ? io() : { on(){}, emit(){} };
    let isAdmin = false;
    const ADMIN_PASSWORD = 'szczurymiejskie';

    function setAdminUI(on) {
      isAdmin = !!on;
      if (on) {
        document.body.classList.add('admin-mode');
        var b = document.getElementById('btn-admin');
        if (b) { b.classList.add('active'); b.textContent = 'Admin ✓'; }
      }
    }

    window.addEventListener('elmove:admin', () => setAdminUI(true));
    if (document.body.classList.contains('admin-mode')) setAdminUI(true);

    function askAdminPassword() {
      return new Promise(function(resolve) {
        var overlay = document.getElementById('admin-pw-overlay');
        var input = document.getElementById('admin-pw-input');
        var ok = document.getElementById('admin-pw-ok');
        var cancel = document.getElementById('admin-pw-cancel');
        if (!overlay) { resolve(window.prompt('Hasło admina:')); return; }
        overlay.classList.add('open');
        input.value = '';
        setTimeout(function(){ try { input.focus(); } catch(e){} }, 30);
        function done(val) {
          overlay.classList.remove('open');
          ok.onclick = null; cancel.onclick = null; input.onkeydown = null;
          resolve(val);
        }
        ok.onclick = function(){ done(input.value); };
        cancel.onclick = function(){ done(null); };
        input.onkeydown = function(e){
          if (e.key === 'Enter') { e.preventDefault(); done(input.value); }
          if (e.key === 'Escape') { e.preventDefault(); done(null); }
        };
      });
    }

    async function ensureAdmin() {
      if (isAdmin) return true;
      var pw = await askAdminPassword();
      if (pw === ADMIN_PASSWORD) {
        setAdminUI(true);
        return true;
      }
      if (pw !== null && pw !== '') alert('Błędne hasło');
      return false;
    }

    var btnAdmin = document.getElementById('btn-admin');
    if (btnAdmin) btnAdmin.onclick = function(){ ensureAdmin(); };

    // ===== Threads =====
    async function loadThreads() {
      const list = document.getElementById('threads-list');
      const refreshBtn = document.getElementById('btn-refresh');
      if (refreshBtn) {
        refreshBtn.disabled = true;
        refreshBtn.textContent = 'Odświeżanie…';
      }
      try {
        const res = await fetch('/api/threads', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        let threads = await res.json();
        if (!Array.isArray(threads)) threads = [];
        list.innerHTML = '';
        if (!threads.length) {
          list.innerHTML = '<p style="color:#888;">Brak wątków. Załóż pierwszy!</p>';
          return;
        }
        threads.forEach(t => {
          const card = document.createElement('div');
          card.className = 'thread-card';
          card.dataset.id = t.id;
          card.innerHTML = `
            <button type="button" class="delete-btn" onclick="deleteThread(${t.id})" title="Usuń wątek">🗑 Usuń</button>
            <h3><a href="thread.html?id=${t.id}">${escapeHtml(t.title)}</a></h3>
            <div class="thread-meta">${escapeHtml(t.author)} · ${new Date(t.created).toLocaleString('pl-PL')}</div>
            <p>${escapeHtml((t.content || '').slice(0, 180))}${(t.content||'').length > 180 ? '…' : ''}</p>
          `;
          list.appendChild(card);
        });
      } catch (err) {
        console.error('loadThreads', err);
        if (list) {
          list.innerHTML = '<p style="color:#c33;">Nie udało się pobrać wątków. Spróbuj ponownie.</p>';
        }
      } finally {
        if (refreshBtn) {
          refreshBtn.disabled = false;
          refreshBtn.textContent = 'Odśwież';
        }
      }
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    window.deleteThread = async function(id) {
      if (!(await ensureAdmin())) return;
      if (!confirm('Na pewno usunąć ten wątek i wszystkie odpowiedzi?')) return;
      const res = await fetch('/api/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: ADMIN_PASSWORD, thread_id: id })
      });
      if (res.ok) loadThreads();
      else alert('Błąd usuwania');
    };

    document.getElementById('btn-new-thread').onclick = () => {
      document.getElementById('new-thread-panel').style.display = 'block';
    };
    document.getElementById('nt-cancel').onclick = () => {
      document.getElementById('new-thread-panel').style.display = 'none';
    };

    // Nick protection UI
    const ntAuthor = document.getElementById('nt-author');
    const ntPassword = document.getElementById('nt-password');
    const ntProtect = document.getElementById('nt-protect');
    const ntSetPassword = document.getElementById('nt-set-password');
    const ntProtectLabel = document.getElementById('nt-protect-label');

    async function checkNickProtected(nick) {
      if (!nick || nick.toLowerCase() === 'anonim') return false;
      try {
        const res = await fetch('/api/nick/' + encodeURIComponent(nick));
        const data = await res.json();
        return !!data.protected;
      } catch { return false; }
    }

    let nickCheckTimer = null;
    ntAuthor.addEventListener('input', () => {
      clearTimeout(nickCheckTimer);
      nickCheckTimer = setTimeout(async () => {
        const nick = ntAuthor.value.trim();
        const protected = await checkNickProtected(nick);
        ntPassword.style.display = protected ? 'block' : 'none';
        ntProtectLabel.style.display = protected ? 'none' : 'flex';
        if (protected) {
          ntProtect.checked = false;
          ntSetPassword.style.display = 'none';
        }
      }, 400);
    });
    ntProtect.addEventListener('change', () => {
      ntSetPassword.style.display = ntProtect.checked ? 'block' : 'none';
    });

    document.getElementById('nt-submit').onclick = async () => {
      const author = ntAuthor.value.trim() || 'Anonim';
      const title = document.getElementById('nt-title').value.trim();
      const content = document.getElementById('nt-content').value.trim();
      if (!title) return alert('Podaj tytuł');

      const body = { author, title, content };
      if (ntPassword.style.display !== 'none') {
        body.password = ntPassword.value;
      }
      if (ntProtect.checked && ntSetPassword.value) {
        body.setPassword = ntSetPassword.value;
      }

      const res = await fetch('/api/threads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        alert(data.error || 'Błąd publikacji');
        return;
      }
      if (data.registered) {
        alert('Nick „' + author + '” został zabezpieczony hasłem. Od teraz zawsze będzie wymagane.');
      }
      document.getElementById('new-thread-panel').style.display = 'none';
      document.getElementById('nt-title').value = '';
      document.getElementById('nt-content').value = '';
      ntPassword.value = '';
      ntSetPassword.value = '';
      ntProtect.checked = false;
      ntSetPassword.style.display = 'none';
      loadThreads();
    };
    (function bindRefresh() {
      var btn = document.getElementById('btn-refresh');
      if (!btn) return;
      btn.type = 'button';
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        loadThreads();
      });
    })();

    // ===== Real-time updates =====
    socket.on('forum:update', (data) => {
      loadThreads();
    });

    // ===== Chat =====
    async function loadChat() {
      const res = await fetch('/api/chat');
      const msgs = await res.json();
      const box = document.getElementById('chat-messages');
      box.innerHTML = '';
      msgs.forEach(m => appendChatMsg(m));
      box.scrollTop = box.scrollHeight;
    }
    function appendChatMsg(m) {
      const box = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'chat-msg';
      div.innerHTML = `<span class="author">${escapeHtml(m.author)}</span>
        <span class="time">${new Date(m.time).toLocaleTimeString('pl-PL')}</span><br>
        ${escapeHtml(m.text)}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
    socket.on('chat:message', appendChatMsg);

    document.getElementById('chat-send').onclick = async () => {
      const author = document.getElementById('chat-author').value.trim() || 'Anonim';
      const text = document.getElementById('chat-text').value.trim();
      if (!text) return;

      let password = undefined;
      try {
        const check = await fetch('/api/nick/' + encodeURIComponent(author));
        const info = await check.json();
        if (info.protected) {
          password = prompt('Nick „' + author + '” jest zabezpieczony. Podaj hasło:');
          if (password === null) return;
        }
      } catch {}

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ author, text, password })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        alert(data.error || 'Błąd wysyłania');
        return;
      }
      document.getElementById('chat-text').value = '';
    };
    document.getElementById('chat-text').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('chat-send').click();
    });

    let chatOpen = true;
    document.getElementById('chat-toggle').onclick = () => {
      chatOpen = !chatOpen;
      document.getElementById('chat-messages').style.display = chatOpen ? 'block' : 'none';
      document.querySelector('.chat-input-row').style.display = chatOpen ? 'flex' : 'none';
      document.getElementById('chat-toggle').textContent = chatOpen ? '−' : '+';
    };

    // Home link same window
    document.getElementById('home-link').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = '../index.html';
    });

    // Init
    loadThreads();
    loadChat();
  </script>
</body>
</html>
